/* =========================================================
   folders.css
   【追加要望対応】音読ディクテーション／読書記録の「フォルダ（見た目上のグループ分け）」、
   および音読ディクテーション画面の余白・分割文一覧の見た目。
   ========================================================= */

/* --- 「フォルダを追加」「新しい〜を追加」ボタン周りの余白 --- */
.folder-add-btn {
  display: block;
  margin-top: var(--spacing-3);
  margin-bottom: var(--spacing-3); /* 「フォルダを追加」と「新しい教材／本を追加」の間 */
}
.folder-add-item-btn {
  display: block;
  margin-bottom: var(--spacing-4); /* 「新しい教材／本を追加」と、その下のフォルダ・教材・本の一覧の間 */
}

/* --- 一覧 --- */
.folder-list-box { margin-top: var(--spacing-2); }
.folder-list-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
  min-height: 48px;
  border-radius: var(--radius-sm);
}
.folder-items { display: flex; flex-direction: column; gap: var(--spacing-2); }
.folder-controls { display: flex; gap: var(--spacing-2); flex-wrap: wrap; }
.folder-controls .btn { flex: 1 1 140px; }
.folder-empty-hint { font-size: var(--fs-sm); }

@media (min-width: 1000px) {
  .folder-items { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-3); }
  .folder-items > .folder-empty-hint { grid-column: 1 / -1; }
}

/* --- ドラッグ操作 --- */
.folder-draggable {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.folder-draggable.is-drag-source { opacity: 0.35; }
.folder-drag-clone {
  position: fixed;
  z-index: 9999;
  margin: 0;
  pointer-events: none;
  opacity: 0.92;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
  transform: scale(1.02);
}
body.folder-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
.folder-list-wrap.is-dragging-active { outline: 2px dashed rgba(79, 107, 64, 0.45); outline-offset: 4px; }
.folder-accordion.is-drop-target,
.folder-list-wrap.is-drop-target {
  outline: 3px dashed var(--color-moss-dark);
  outline-offset: 2px;
  background-color: rgba(111, 143, 92, 0.16);
}

/* --- 音読ディクテーション画面の余白 --- */
.dict-row-spaced { margin-top: var(--spacing-3); } /* 「今の位置を開始にする」行と「試し再生／保存」行の間 */
.dict-btn-gap { display: block; margin-top: var(--spacing-3); } /* 「この教材を削除する」と「一覧に戻る」の間など */
.dict-reward-note { min-height: 1.4em; }

/* --- 「▶ 練習する」画面：一文ごとに改行された分割文 --- */
.dict-listen-list { display: flex; flex-direction: column; gap: var(--spacing-2); margin-top: var(--spacing-3); }
.dict-sentence-btn {
  display: flex;
  align-items: baseline;
  gap: var(--spacing-2);
  width: 100%;
  text-align: left;
  border: var(--border-thin);
  cursor: pointer;
  color: var(--color-ink);
  font: inherit;
}
.dict-sentence-btn.is-playing { background-color: rgba(111, 143, 92, 0.28); border-color: var(--color-moss-dark); }
.dict-sentence-btn.is-disabled { opacity: 0.55; cursor: not-allowed; }
.dict-sentence-no { flex: 0 0 auto; min-width: 1.6em; color: var(--color-ink-soft); font-size: var(--fs-sm); }
.dict-sentence-text { flex: 1 1 auto; word-break: break-word; }
.dict-sentence-note { flex: 0 0 auto; font-size: var(--fs-sm); color: var(--color-ink-soft); }

@media (hover: hover) and (pointer: fine) {
  .dict-sentence-btn:not(.is-disabled):hover { filter: brightness(0.97); }
}
@media (prefers-reduced-motion: reduce) {
  .folder-drag-clone { transform: none; }
}

/* ===== assetManager.js ===== */
/**
 * assetManager.js
 * -----------------------------------------
 * 【追加要望対応】設定画面の各種画像アップロード（ジャンル/問題セットの背景画像、
 * キャラクター/建築物の画像）を一元的に処理するモジュール。
 *
 * 方針（要望6章対応）：
 *   このアプリは外部バックエンドを持たない静的サイトなので、画像を「保存」する先は
 *   2通りある。
 *     ① GitHub連携が設定済み（設定画面でowner/repo/token等を入力済み）の場合：
 *        ブラウザから直接 GitHub Contents API を叩き、リポジトリの
 *        assets/img/ 配下に画像ファイルをPUTする（＝要望1章「自動でGitHubの
 *        assetsディレクトリ内のimgディレクトリに保存する仕組み」）。
 *        成功すればそのファイルの raw.githubusercontent.com URLを画像として使う。
 *     ② GitHub連携が未設定、またはアップロードに失敗した場合：
 *        画像をDataURL（Base64）に変換し、そのままgameStateに保存する。
 *        これはIndexedDB/LocalStorageへの自動保存、およびバックアップJSON出力
 *        （ImportExport.exportBackup）に自動的に含まれるため、GitHubに頼らず
 *        端末内・バックアップJSON経由でも画像を引き継げる（要望6章の
 *        「assetsフォルダ内のimg/videoフォルダを参照し、エリアとの紐づけを
 *        JSONファイル及びIndexedDBへのバックアップでつなげる」に対応）。
 *
 *   どちらの経路でも戻り値の image は文字列（URLまたはdataURL）であり、
 *   <img src="..."> にもSVGの <image href="..."> にもそのまま使える。
 *
 *   GitHub Personal Access Tokenは state.user.settings.github に保存され、
 *   ブラウザのIndexedDB/LocalStorageにのみ残る（Anthropic等の外部には送信されない。
 *   通信先は常にユーザー自身が指定したapi.github.comのみ）。
 */

const AssetManager = (() => {
  function getGithubConfig() {
    const state = GameState.getState();
    const settings = state.user && state.user.settings;
    return (settings && settings.github) || { owner: "", repo: "", branch: "main", token: "" };
  }

  function setGithubConfig({ owner, repo, branch, token }) {
    GameState.update((s) => {
      if (!s.user.settings) s.user.settings = {};
      s.user.settings.github = {
        owner: (owner || "").trim(),
        repo: (repo || "").trim(),
        branch: (branch || "").trim() || "main",
        token: (token || "").trim(),
      };
    });
  }

  function isGithubConfigured() {
    const c = getGithubConfig();
    return !!(c.owner && c.repo && c.token);
  }

  function fileToDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error || new Error("読み込みに失敗しました"));
      reader.readAsDataURL(file);
    });
  }

  function base64BodyOf(dataUrl) {
    const idx = dataUrl.indexOf(",");
    return idx >= 0 ? dataUrl.slice(idx + 1) : dataUrl;
  }

  function sanitizeFileName(name) {
    return String(name || "image.png").replace(/[^a-zA-Z0-9_.-]/g, "_");
  }

  /**
   * 画像ファイルをアップロードする。
   * @param {File} file
   * @param {string} folderHint 用途を表す短い文字列（ファイル名の接頭辞に使う。例："genre" "character"）
   * @returns {Promise<{image:string, usedGithub:boolean}>}
   */
  async function uploadImage(file, folderHint = "misc") {
    const dataUrl = await fileToDataURL(file);

    if (!isGithubConfigured()) {
      return { image: dataUrl, usedGithub: false };
    }

    const config = getGithubConfig();
    try {
      const filename = `${folderHint}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}_${sanitizeFileName(file.name)}`;
      const path = `assets/img/${filename}`;
      const apiUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${encodeURIComponent(path).replace(/%2F/g, "/")}`;

      const res = await fetch(apiUrl, {
        method: "PUT",
        headers: {
          "Authorization": `token ${config.token}`,
          "Content-Type": "application/json",
          "Accept": "application/vnd.github+json",
        },
        body: JSON.stringify({
          message: `assets: add ${filename}`,
          content: base64BodyOf(dataUrl),
          branch: config.branch || "main",
        }),
      });

      if (!res.ok) {
        const errText = await res.text().catch(() => "");
        console.error("[assetManager] GitHubへの画像保存に失敗しました", res.status, errText);
        Utils.showToast("GitHubへの自動保存に失敗したため、ブラウザ内保存のみで続行します", "error");
        return { image: dataUrl, usedGithub: false };
      }

      const json = await res.json();
      const url = (json.content && json.content.download_url) || dataUrl;
      Utils.showToast("画像をGitHubのassets/imgに保存しました", "success");
      return { image: url, usedGithub: true, path };
    } catch (err) {
      console.error("[assetManager] GitHubアップロード中に例外が発生しました", err);
      Utils.showToast("GitHubへの自動保存に失敗したため、ブラウザ内保存のみで続行します", "error");
      return { image: dataUrl, usedGithub: false };
    }
  }

  /** 値が画像として表示可能な文字列か（dataURL or http URL）。絵文字プレースホルダーと区別するため */
  function isImageValue(value) {
    return typeof value === "string" && (value.startsWith("data:image") || /^https?:\/\//.test(value));
  }

  return {
    getGithubConfig, setGithubConfig, isGithubConfigured,
    uploadImage, fileToDataURL, isImageValue,
  };
})();

/* ===== zipUtil.js ===== */
/**
 * zipUtil.js
 * -----------------------------------------
 * 【追加要望対応】ZIPバックアップ用の最小限のZIP読み書き（外部ライブラリ不使用）。
 *
 *   ZipUtil.create(entries) → Blob
 *       entries: [{ name:string, data:Uint8Array|string }]  ※圧縮なし（store）で書き出す
 *       音声（m4a/mp3など）は元々圧縮済みのため、無圧縮でもサイズはほぼ変わらない。
 *   ZipUtil.read(arrayBuffer) → Promise<Map<string, Uint8Array>>
 *       無圧縮（store）と deflate 圧縮のZIPを読める。deflate はブラウザの
 *       DecompressionStream に対応している環境のみ（非対応の場合は日本語エラー）。
 *
 * 制限：ZIP64（4GB超・65535ファイル超）には対応しない。
 */

const ZipUtil = (() => {
  const encoder = new TextEncoder();
  const decoder = new TextDecoder("utf-8");

  let crcTable = null;
  function getCrcTable() {
    if (crcTable) return crcTable;
    crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crcTable[n] = c >>> 0;
    }
    return crcTable;
  }

  function crc32(bytes) {
    const table = getCrcTable();
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) crc = table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function dosDateTime(date) {
    const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
    const day = ((Math.max(1980, date.getFullYear()) - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
    return { time, day };
  }

  function create(entries) {
    const now = dosDateTime(new Date());
    const parts = [];
    const central = [];
    let offset = 0;

    entries.forEach((entry) => {
      const nameBytes = encoder.encode(entry.name);
      const data = typeof entry.data === "string" ? encoder.encode(entry.data) : entry.data;
      const crc = crc32(data);

      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true); // ファイル名はUTF-8
      local.setUint16(8, 0, true);      // 無圧縮
      local.setUint16(10, now.time, true);
      local.setUint16(12, now.day, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true);
      local.setUint32(22, data.length, true);
      local.setUint16(26, nameBytes.length, true);
      local.setUint16(28, 0, true);
      parts.push(new Uint8Array(local.buffer), nameBytes, data);

      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true);
      cen.setUint16(4, 20, true);
      cen.setUint16(6, 20, true);
      cen.setUint16(8, 0x0800, true);
      cen.setUint16(10, 0, true);
      cen.setUint16(12, now.time, true);
      cen.setUint16(14, now.day, true);
      cen.setUint32(16, crc, true);
      cen.setUint32(20, data.length, true);
      cen.setUint32(24, data.length, true);
      cen.setUint16(28, nameBytes.length, true);
      cen.setUint32(42, offset, true);
      central.push(new Uint8Array(cen.buffer), nameBytes);

      offset += 30 + nameBytes.length + data.length;
    });

    const centralSize = central.reduce((sum, p) => sum + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);

    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
  }

  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === "undefined") {
      throw new Error("このブラウザは圧縮されたZIPの展開に対応していません（このアプリで書き出したZIPを使ってください）");
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function read(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    const view = new DataView(arrayBuffer);

    // 末尾から End of Central Directory を探す
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 22 - 65535); i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("ZIPファイルの形式が正しくありません");

    const count = view.getUint16(eocd + 10, true);
    let pos = view.getUint32(eocd + 16, true);
    const files = new Map();

    for (let i = 0; i < count; i++) {
      if (view.getUint32(pos, true) !== 0x02014b50) throw new Error("ZIPファイルが壊れています（目次を読めません）");
      const method = view.getUint16(pos + 10, true);
      const compSize = view.getUint32(pos + 20, true);
      const nameLen = view.getUint16(pos + 28, true);
      const extraLen = view.getUint16(pos + 30, true);
      const commentLen = view.getUint16(pos + 32, true);
      const localOffset = view.getUint32(pos + 42, true);
      const name = decoder.decode(bytes.subarray(pos + 46, pos + 46 + nameLen));
      pos += 46 + nameLen + extraLen + commentLen;

      if (name.endsWith("/")) continue; // フォルダ項目

      if (view.getUint32(localOffset, true) !== 0x04034b50) throw new Error("ZIPファイルが壊れています（データ位置が不正です）");
      const dataStart = localOffset + 30 + view.getUint16(localOffset + 26, true) + view.getUint16(localOffset + 28, true);
      const raw = bytes.subarray(dataStart, dataStart + compSize);

      if (method === 0) files.set(name, raw);
      else if (method === 8) files.set(name, await inflateRaw(raw));
      else throw new Error("未対応の圧縮方式のZIPです");
    }
    return files;
  }

  function textOf(bytes) {
    return decoder.decode(bytes);
  }

  return { create, read, textOf };
})();

/* ===== folderList.js ===== */
/**
 * folderList.js
 * -----------------------------------------
 * 【追加要望対応】音読ディクテーション一覧・読書記録一覧で共通に使う「フォルダ（見た目上の
 * グループ分け）」機能。
 *
 *   ・フォルダ = { id, name, open } を state[foldersKey] に保存する。
 *   ・各アイテム（教材・本）は folderId（null/未設定 = フォルダ外）を持つ。フォルダは
 *     見た目上のグループ分けだけで、アイテム自体の内容・動作には一切影響しない。
 *   ・フォルダはアコーディオン（<details>）で開閉できる。開閉状態も保存する。
 *   ・移動方法：
 *       PC     … アイテムをマウスでドラッグしてフォルダの上にドロップ
 *       スマホ … アイテムを長押し（約0.45秒）してからドラッグしてフォルダの上で離す
 *     フォルダ外へ出すときは、フォルダ以外の場所（一覧の余白やフォルダ外のアイテムの上）に
 *     ドロップする。
 *   ・ポインターイベントだけで実装（マウス・タッチ・ペン共通）。外部ライブラリ不使用。
 *
 * フォルダを削除してもアイテムは削除されず、フォルダ外へ戻るだけ（損失回避の方針）。
 */

const FolderList = (() => {
  const LONG_PRESS_MS = 450;      // タッチ操作でドラッグを始めるまでの長押し時間
  const TOUCH_CANCEL_MOVE_PX = 10; // 長押し成立前にこれ以上動いたらスクロールとみなす
  const MOUSE_START_MOVE_PX = 6;  // マウスでドラッグを始める移動量
  const EDGE_SCROLL_ZONE_PX = 64; // 画面端の自動スクロール範囲
  const EDGE_SCROLL_SPEED_PX = 12;

  /* ============================================================
     データ操作
     ============================================================ */

  function getFolders(foldersKey) {
    return GameState.getState()[foldersKey] || [];
  }

  function createFolder(foldersKey, name) {
    const id = Utils.generateId("folder");
    GameState.update((state) => {
      if (!state[foldersKey]) state[foldersKey] = [];
      state[foldersKey].push({
        id,
        name: (name || "").trim().slice(0, 60) || "新しいフォルダ",
        open: true,
      });
    });
    return id;
  }

  function renameFolder(foldersKey, folderId, name) {
    const trimmed = (name || "").trim().slice(0, 60);
    if (!trimmed) return;
    GameState.update((state) => {
      const f = (state[foldersKey] || []).find((x) => x.id === folderId);
      if (f) f.name = trimmed;
    });
  }

  function setFolderOpen(foldersKey, folderId, open) {
    const f = getFolders(foldersKey).find((x) => x.id === folderId);
    if (!f || !!f.open === !!open) return;
    GameState.update((state) => {
      const target = (state[foldersKey] || []).find((x) => x.id === folderId);
      if (target) target.open = !!open;
    });
  }

  /** フォルダだけを削除する。中のアイテムは削除せず、フォルダ外へ戻す。 */
  function deleteFolder(foldersKey, itemsKey, folderId) {
    GameState.update((state) => {
      state[foldersKey] = (state[foldersKey] || []).filter((f) => f.id !== folderId);
      (state[itemsKey] || []).forEach((item) => {
        if (item.folderId === folderId) item.folderId = null;
      });
    });
  }

  function moveItem(itemsKey, itemId, folderId) {
    GameState.update((state) => {
      const item = (state[itemsKey] || []).find((x) => x.id === itemId);
      if (item) item.folderId = folderId || null;
    });
  }

  /* ============================================================
     UI部品
     ============================================================ */

  /** 「フォルダを追加」ボタン。onCreated はフォルダ作成後（再描画用）に呼ばれる。 */
  function createAddFolderButton(foldersKey, onCreated) {
    return Utils.el("button", {
      class: "btn btn-secondary btn-block folder-add-btn",
      onclick: async () => {
        const name = await uiPrompt("フォルダの名前を入力してください", "新しいフォルダ");
        if (name === null) return;
        createFolder(foldersKey, name);
        Utils.showToast("フォルダを追加しました", "success");
        if (onCreated) onCreated();
      },
    }, "📁 フォルダを追加");
  }

  /**
   * フォルダ付き一覧を描画する。
   * @param {HTMLElement} container 描画先（中身は一旦空にする）
   * @param {object} opts
   *   foldersKey / itemsKey : state上のキー
   *   items                 : 表示するアイテム配列（検索などで絞り込み済みのもの）
   *   renderItem(item)      : アイテム1件のDOM要素を返す（ドラッグ対象になる）
   *   onChange()            : 移動・フォルダ編集後に再描画するためのコールバック
   *   filtering             : true の間は、該当アイテムの無いフォルダを隠し、該当フォルダを開いて表示する
   *   emptyMessage          : フォルダ外にも何も無いときの文言
   */
  function render(container, opts) {
    const { foldersKey, itemsKey, items, renderItem, onChange, filtering = false, emptyMessage = "" } = opts;
    container.innerHTML = "";

    const wrap = Utils.el("div", { class: "folder-list-wrap", "data-drop-folder": "" });
    const folders = getFolders(foldersKey);
    const folderIds = new Set(folders.map((f) => f.id));

    const byFolder = new Map();
    const rootItems = [];
    items.forEach((item) => {
      if (item.folderId && folderIds.has(item.folderId)) {
        if (!byFolder.has(item.folderId)) byFolder.set(item.folderId, []);
        byFolder.get(item.folderId).push(item);
      } else {
        rootItems.push(item);
      }
    });

    const makeDraggable = (el, item) => {
      attachDrag(el, { itemId: item.id, itemsKey, wrap, onChange });
      return el;
    };

    folders.forEach((folder) => {
      const inFolder = byFolder.get(folder.id) || [];
      if (filtering && inFolder.length === 0) return;

      const details = Utils.el("details", {
        class: "settings-accordion folder-accordion",
        "data-drop-folder": folder.id,
      });
      if (filtering || folder.open) details.setAttribute("open", "");
      details.addEventListener("toggle", () => {
        if (!filtering) setFolderOpen(foldersKey, folder.id, details.open);
      });

      details.appendChild(Utils.el("summary", {}, `📁 ${folder.name}（${inFolder.length}）`));

      const controls = Utils.el("div", { class: "folder-controls" }, [
        Utils.el("button", {
          class: "btn btn-secondary",
          onclick: async () => {
            const name = await uiPrompt("フォルダの新しい名前", folder.name);
            if (name === null || !name.trim()) return;
            renameFolder(foldersKey, folder.id, name);
            if (onChange) onChange();
          },
        }, "名前を変更"),
        Utils.el("button", {
          class: "btn btn-secondary",
          onclick: async () => {
            if (!(await uiConfirm(`フォルダ「${folder.name}」を削除しますか？中身は削除されず、フォルダの外に戻ります。`,'削除'))) return;
            deleteFolder(foldersKey, itemsKey, folder.id);
            if (onChange) onChange();
          },
        }, "フォルダを削除"),
      ]);
      details.appendChild(controls);

      const list = Utils.el("div", { class: "folder-items" });
      inFolder.forEach((item) => list.appendChild(makeDraggable(renderItem(item), item)));
      if (inFolder.length === 0) {
        list.appendChild(Utils.el("p", { class: "empty-state folder-empty-hint" }, "ここにドラッグ（スマホは長押ししてからドラッグ）して入れます。"));
      }
      details.appendChild(list);
      wrap.appendChild(details);
    });

    const rootList = Utils.el("div", { class: "folder-items folder-root-items" });
    rootItems.forEach((item) => rootList.appendChild(makeDraggable(renderItem(item), item)));
    wrap.appendChild(rootList);

    if (rootItems.length === 0 && byFolder.size === 0 && emptyMessage) {
      wrap.appendChild(Utils.el("p", { class: "empty-state" }, emptyMessage));
    }
    container.appendChild(wrap);
  }

  /* ============================================================
     ドラッグ処理（マウスはそのままドラッグ、タッチは長押し後にドラッグ）
     ============================================================ */

  let pending = null; // 押下中（まだドラッグ開始前）
  let drag = null;    // ドラッグ中
  let listenersReady = false;
  let rafId = null;

  function ensureDocumentListeners() {
    if (listenersReady) return;
    listenersReady = true;
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    document.addEventListener("pointercancel", onPointerCancel);
    // ドラッグ中は、タッチによる画面スクロールを止める（非passiveで登録が必要）
    document.addEventListener("touchmove", (e) => {
      if (drag && e.cancelable) e.preventDefault();
    }, { passive: false });
  }

  function attachDrag(el, ctx) {
    ensureDocumentListeners();
    el.classList.add("folder-draggable");
    el.addEventListener("pointerdown", (e) => {
      if (drag || pending) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      const st = {
        el, ctx,
        pointerId: e.pointerId,
        pointerType: e.pointerType,
        startX: e.clientX, startY: e.clientY,
        x: e.clientX, y: e.clientY,
        offsetX: 0, offsetY: 0,
        timer: null, clone: null, target: null,
      };
      pending = st;
      if (e.pointerType !== "mouse") {
        st.timer = setTimeout(() => { if (pending === st) activate(st); }, LONG_PRESS_MS);
      }
    });
    // 長押しで出るコンテキストメニュー（スマホ）を、ドラッグ準備中・ドラッグ中は抑止する
    el.addEventListener("contextmenu", (e) => { if (pending || drag) e.preventDefault(); });
  }

  function activate(st) {
    if (st.timer) { clearTimeout(st.timer); st.timer = null; }
    pending = null;
    drag = st;

    const rect = st.el.getBoundingClientRect();
    st.offsetX = st.x - rect.left;
    st.offsetY = st.y - rect.top;

    const clone = st.el.cloneNode(true);
    clone.classList.add("folder-drag-clone");
    clone.style.width = `${rect.width}px`;
    clone.style.left = `${rect.left}px`;
    clone.style.top = `${rect.top}px`;
    document.body.appendChild(clone);
    st.clone = clone;

    st.el.classList.add("is-drag-source");
    st.ctx.wrap.classList.add("is-dragging-active");
    document.body.classList.add("folder-dragging");
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) { /* 非対応環境は無視 */ } }

    rafId = requestAnimationFrame(tick);
  }

  function findDropTarget(st) {
    if (st.clone) st.clone.style.visibility = "hidden";
    const hit = document.elementFromPoint(st.x, st.y);
    if (st.clone) st.clone.style.visibility = "";
    if (!hit) return null;
    const target = hit.closest("[data-drop-folder]");
    // 別の一覧（別画面の要素など）へは落とさない
    if (!target || !st.ctx.wrap.contains(target) && target !== st.ctx.wrap) return null;
    return target;
  }

  function updateTarget(st) {
    const target = findDropTarget(st);
    if (target === st.target) return;
    if (st.target) st.target.classList.remove("is-drop-target");
    st.target = target;
    if (target) target.classList.add("is-drop-target");
  }

  function tick() {
    if (!drag) return;
    const st = drag;
    // 画面の上下端に近いとき自動スクロール（長い一覧でも端まで運べるように）
    const scroller = document.getElementById("screen-container");
    if (scroller) {
      const r = scroller.getBoundingClientRect();
      if (st.y < r.top + EDGE_SCROLL_ZONE_PX) scroller.scrollTop -= EDGE_SCROLL_SPEED_PX;
      else if (st.y > r.bottom - EDGE_SCROLL_ZONE_PX) scroller.scrollTop += EDGE_SCROLL_SPEED_PX;
    }
    updateTarget(st);
    rafId = requestAnimationFrame(tick);
  }

  function onPointerMove(e) {
    const st = drag || pending;
    if (!st || e.pointerId !== st.pointerId) return;
    st.x = e.clientX;
    st.y = e.clientY;

    if (drag) {
      st.clone.style.left = `${st.x - st.offsetX}px`;
      st.clone.style.top = `${st.y - st.offsetY}px`;
      return;
    }
    const dist = Math.hypot(st.x - st.startX, st.y - st.startY);
    if (st.pointerType === "mouse") {
      if (dist > MOUSE_START_MOVE_PX) activate(st);
    } else if (dist > TOUCH_CANCEL_MOVE_PX) {
      // 長押しが成立する前に指が動いた＝通常のスクロール操作なのでドラッグは開始しない
      clearTimeout(st.timer);
      pending = null;
    }
  }

  function endDrag(commit) {
    const st = drag;
    if (!st) return;
    drag = null;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

    const target = commit ? (st.target || findDropTarget(st)) : null;
    if (st.target) st.target.classList.remove("is-drop-target");
    if (st.clone) st.clone.remove();
    st.el.classList.remove("is-drag-source");
    st.ctx.wrap.classList.remove("is-dragging-active");
    document.body.classList.remove("folder-dragging");

    // ドラッグ操作の直後に発生する「クリック」（教材・本を開いてしまう動作）を1回だけ無効化する
    const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener("click", swallow, { capture: true, once: true });
    setTimeout(() => document.removeEventListener("click", swallow, { capture: true }), 400);

    if (!target) return;
    const folderId = target.getAttribute("data-drop-folder") || null;
    const current = (GameState.getState()[st.ctx.itemsKey] || []).find((x) => x.id === st.ctx.itemId);
    if (!current || (current.folderId || null) === folderId) return;
    moveItem(st.ctx.itemsKey, st.ctx.itemId, folderId);
    if (st.ctx.onChange) st.ctx.onChange();
  }

  function onPointerUp(e) {
    if (pending && e.pointerId === pending.pointerId) {
      if (pending.timer) clearTimeout(pending.timer);
      pending = null; // 通常のタップ／クリックとして扱う
      return;
    }
    if (drag && e.pointerId === drag.pointerId) endDrag(true);
  }

  function onPointerCancel(e) {
    if (pending && e.pointerId === pending.pointerId) {
      if (pending.timer) clearTimeout(pending.timer);
      pending = null;
      return;
    }
    if (drag && e.pointerId === drag.pointerId) endDrag(false);
  }

  return {
    render, createAddFolderButton,
    createFolder, renameFolder, deleteFolder, setFolderOpen, moveItem, getFolders,
  };
})();

/* ===== readingSystem.js ===== */
/**
 * readingSystem.js
 * -----------------------------------------
 * Phase8：読書記録システム（仕様62章）。学習ゲームの主目的からは外れる
 * 任意機能のため、日記のように何かを強制したりガチャ解放条件にはしない
 * （仕様60章「読書していない日でも日記可能。日記は読書を強制しない」に準拠）。
 *
 * 1冊 = 1 book レコード：
 *   { id, title, author, publisher, tags:[], rereadFlag,
 *     bookSummary,                         // 本の要約（目安150文字）
 *     chapters: [{ id, name, summary }],   // 章要約（目安30文字）
 *     quotes: [{ id, text, note }],        // 引用
 *     ladder: [{ id, kind:"abstract"|"concrete", text }], // 抽象⇄具体（横方向に無限追加）
 *     criticalQuestions: [{ id, question, answer }],      // 批判的読書テンプレート
 *     createdAt, updatedAt }
 *
 * 【仕様に明記が無く判断した点】
 *   - 章要約30文字・本要約150文字は「目安」として文字数カウンターを表示するのみで、
 *     入力を強制的にブロックしない（認知負荷を減らす方針を優先。仕様書冒頭の
 *     判断優先順位②に基づく）。
 *   - 批判的読書テンプレートの初期質問6個はcriticalQuestionsに自動で種として
 *     入る。ユーザーは自由に追加・削除できる（仕様62章「自由追加可能」）。
 */

const ReadingSystem = (() => {
  const DEFAULT_CRITICAL_QUESTIONS = ["本当に？", "前提は？", "例外は？", "根拠は？", "他の説明は？", "反証は？"];
  const CHAPTER_SUMMARY_TARGET = 30;
  const BOOK_SUMMARY_TARGET = 150;

  /**
   * 【追加要望対応】読書記録の「章ごとの要約」「抽象」「抽象⇄具体」「批判的読書テンプレート」を
   * アコーディオン（開閉式、<details>）表示にするための共通ヘルパー。
   * router.js内のsettingsAccordion()と同じ見た目（css/style.css .settings-accordion）を再利用する。
   */
  function readingAccordion(title, children, opts = {}) {
    const summary = Utils.el("summary", {}, title);
    const details = Utils.el("details", { class: "settings-accordion" }, [summary, ...children]);
    if (opts.open) details.setAttribute("open", "");
    return details;
  }

  /**
   * 【追加要望対応】読書記録を「一冊分」書き上げたときに、過去日記チケットを1枚獲得する。
   * 「一冊分」の判定（仕様に無いため判断した。HANDOFF.md参照）：
   *   ・タイトルが初期値（無題の本）以外で入力されている
   *   ・本の要約が記入されている
   *   ・章ごとの要約が1つ以上記入されている
   * 1冊につき1回だけ獲得できる（book.diaryTicketGranted）。
   */
  function isBookComplete(book) {
    if (!book) return false;
    const title = (book.title || "").trim();
    if (!title || title === "無題の本") return false;
    if (!(book.bookSummary || "").trim()) return false;
    return (book.chapters || []).some((c) => (c.summary || "").trim());
  }

  function awardTicketIfComplete(bookId) {
    let granted = false;
    GameState.update((state) => {
      const b = state.books.find((x) => x.id === bookId);
      if (!b || b.diaryTicketGranted || !isBookComplete(b)) return;
      b.diaryTicketGranted = true;
      state.diaryTickets = (state.diaryTickets || 0) + 1;
      granted = true;
    });
    if (granted) Utils.showToast("🎫 読書記録を一冊分書き上げました！過去の日記を書けるチケットを1枚獲得", "success");
    return granted;
  }

  function getAll() {
    return GameState.getState().books || [];
  }

  function getById(id) {
    return getAll().find((b) => b.id === id) || null;
  }

  function createBook({ title, author, publisher }) {
    const id = Utils.generateId("book");
    GameState.update((state) => {
      state.books.push({
        id,
        title: title.trim().slice(0, 100) || "無題の本",
        author: (author || "").trim().slice(0, 60),
        publisher: (publisher || "").trim().slice(0, 60),
        tags: [],
        rereadFlag: false,
        folderId: null,
        diaryTicketGranted: false,
        bookSummary: "",
        chapters: [],
        quotes: [],
        ladder: [],
        criticalQuestions: DEFAULT_CRITICAL_QUESTIONS.map((q) => ({ id: Utils.generateId("cq"), question: q, answer: "" })),
        createdAt: Utils.todayStr(),
        updatedAt: Utils.todayStr(),
      });
    });
    return id;
  }

  function updateBook(id, patch) {
    GameState.update((state) => {
      const b = state.books.find((x) => x.id === id);
      if (!b) return;
      Object.assign(b, patch);
      b.updatedAt = Utils.todayStr();
    });
    awardTicketIfComplete(id);
  }

  function deleteBook(id) {
    GameState.update((state) => {
      state.books = state.books.filter((b) => b.id !== id);
    });
  }

  function addChapter(bookId, name) {
    GameState.update((state) => {
      const b = state.books.find((x) => x.id === bookId);
      if (!b) return;
      b.chapters.push({ id: Utils.generateId("chap"), name: name.trim().slice(0, 60) || `第${b.chapters.length + 1}章`, summary: "" });
      b.updatedAt = Utils.todayStr();
    });
  }

  function updateChapterSummary(bookId, chapterId, summary) {
    GameState.update((state) => {
      const b = state.books.find((x) => x.id === bookId);
      const c = b?.chapters.find((x) => x.id === chapterId);
      if (c) c.summary = summary.slice(0, 200);
    });
    awardTicketIfComplete(bookId);
  }

  function addQuote(bookId, text, note) {
    GameState.update((state) => {
      const b = state.books.find((x) => x.id === bookId);
      if (!b) return;
      b.quotes.push({ id: Utils.generateId("quote"), text: text.trim().slice(0, 300), note: (note || "").trim().slice(0, 300) });
    });
  }

  /** 抽象⇄具体の鎖に1項目追加する。種類は交互を推奨するがUI側でボタンを分けるのみで強制はしない */
  function addLadderItem(bookId, kind, text) {
    GameState.update((state) => {
      const b = state.books.find((x) => x.id === bookId);
      if (!b) return;
      b.ladder.push({ id: Utils.generateId("ladder"), kind, text: text.trim().slice(0, 200) });
    });
  }

  function addCriticalQuestion(bookId, question) {
    GameState.update((state) => {
      const b = state.books.find((x) => x.id === bookId);
      if (!b) return;
      b.criticalQuestions.push({ id: Utils.generateId("cq"), question: question.trim().slice(0, 100), answer: "" });
    });
  }

  function updateCriticalAnswer(bookId, questionId, answer) {
    GameState.update((state) => {
      const b = state.books.find((x) => x.id === bookId);
      const q = b?.criticalQuestions.find((x) => x.id === questionId);
      if (q) q.answer = answer.slice(0, 400);
    });
  }

  function setTags(bookId, tagsText) {
    const tags = tagsText.split(/[,、\s]+/).map((t) => t.trim()).filter(Boolean).slice(0, 20);
    updateBook(bookId, { tags });
  }

  /** 検索（仕様62章：タグ・期間・除外・キーワード） */
  function search({ keyword = "", tag = "", excludeKeyword = "", fromDate = "", toDate = "" } = {}) {
    return getAll().filter((b) => {
      if (tag && !b.tags.includes(tag)) return false;
      if (fromDate && b.updatedAt < fromDate) return false;
      if (toDate && b.updatedAt > toDate) return false;
      const haystack = [b.title, b.author, b.bookSummary, ...(b.quotes || []).map((q) => q.text)].join(" ");
      if (keyword && !haystack.includes(keyword)) return false;
      if (excludeKeyword && haystack.includes(excludeKeyword)) return false;
      return true;
    });
  }

  function getAllTags() {
    const set = new Set();
    getAll().forEach((b) => b.tags.forEach((t) => set.add(t)));
    return [...set];
  }

    // 【追加要望対応】「フォルダを追加」を「新しい本を追加」の上に配置（見た目上のグループ分け）

})();

/* ===== dictationSystem.js ===== */
/**
 * dictationSystem.js
 * -----------------------------------------
 * 【追加要望対応】外国語の音読用ディクテーション機能。
 * 「霧晴れの開拓日誌」から「読書記録」と並べて入れる、学習ゲームの主目的からは
 * 独立した任意機能（readingSystem.jsと同じ位置づけ。ガチャ解放条件等には関与しない）。
 *
 * 1セット = 1つの音読教材：
 *   { id, title,
 *     sentences: [{ id, text, audio: { fileId, start, end } | null }],
 *     audioFiles: [{ id, name, dataUrl }],   // フォルダ単位でまとめてアップロードした音源
 *     createdAt, updatedAt }
 *
 * 【追加要望対応（HANDOFF.md 19章）】
 *   ・画面：dictationList（一覧＋フォルダ＋ZIPバックアップ）／dictationDetail（編集）／
 *     dictationListen（▶ 練習する：分割文の一覧と音声）／dictationPractice（ディクテーション）
 *   ・コイン報酬：練習する（分割前の音声を最後まで再生）5個、ディクテーション（最後まで解答）5個、
 *     全問正解20個。いずれも「編集画面に戻る」を押したときに付与（同じ教材・同じ種類は1日1回まで）。
 *
 * 【仕様に明記が無く判断した点（要レビュー。HANDOFF.md参照）】
 *   - 「自動でテキストを参照して音声を分割」は、音声認識・音素解析を伴う本格的な
 *     自動分割はブラウザ内の範囲を超えるため、「1つの音源ファイルの総再生時間を、
 *     各文の文字数の比率で按分する」という簡易的な仮分割（ヒューリスティック）とした。
 *     結果はあくまで「たたき台」であり、その後の「手動での音声カットと対応」で
 *     利用者が実際の音声を聞きながら開始・終了位置を修正する運用を想定している。
 *   - 音源はdataURL（Base64）としてIndexedDBに保存する（assetManager.jsの画像保存と
 *     同じ方式）。音声ファイルは画像より容量が大きくなりやすいため、大量・長時間の
 *     音源を扱う場合はバックアップJSONの肥大化に注意（HANDOFF.mdに記載）。
 */

const DictationSystem = (() => {

  // 【追加要望対応】コイン報酬（仕様に金額の指定があるもの）。
  const REWARD_LISTEN = 5;             // 「練習する」で分割前の音声を最後まで再生
  const REWARD_DICTATION = 5;          // 「ディクテーション」を最後の問題まで解いた
  const REWARD_DICTATION_PERFECT = 20; // 上記のうち全問正解
  // 仕様に明記が無く判断した点：コインの無限取得（同じ教材の周回）を防ぐため、
  // 「同じ教材・同じ種類の報酬は1日に1回まで」とした。falseにすると毎回受け取れる。
  const REWARD_ONCE_PER_DAY = true;

  function getAll() {
    return GameState.getState().dictationSets || [];
  }

  /**
   * 報酬を受け取る。kind: "listen" | "dictation"。
   * 同じ日に同じ種類を受け取り済みの場合は、差額だけ付与（例：5個受取済み→全問正解で+15個）。
   * @returns {number} 実際に付与したコイン数（0なら受取済み）
   */
  function claimReward(setId, kind, amount) {
    const today = Utils.todayStr();
    let granted = amount;
    GameState.update((state) => {
      if (!state.dictationRewards) state.dictationRewards = {};
      if (!state.dictationRewards[setId]) state.dictationRewards[setId] = {};
      const rec = state.dictationRewards[setId][kind];
      if (REWARD_ONCE_PER_DAY && rec && rec.date === today) granted = Math.max(0, amount - rec.amount);
      if (granted > 0) {
        const prev = (rec && rec.date === today) ? rec.amount : 0;
        state.dictationRewards[setId][kind] = { date: today, amount: prev + granted };
      }
    });
    if (granted > 0) RewardSystem.grantCompass(granted);
    return granted;
  }

  /** 教材内の音源のうち、分割前の「元の音声」とみなすもの（文に最も多く割り当てられている音源、無ければ先頭） */
  function getOriginalAudioFile(set) {
    if (!set || !set.audioFiles || set.audioFiles.length === 0) return null;
    const counts = new Map();
    (set.sentences || []).forEach((sent) => {
      if (sent.audio) counts.set(sent.audio.fileId, (counts.get(sent.audio.fileId) || 0) + 1);
    });
    let bestId = null;
    let best = 0;
    counts.forEach((n, id) => { if (n > best) { best = n; bestId = id; } });
    return set.audioFiles.find((f) => f.id === bestId) || set.audioFiles[0];
  }

  /** ディクテーション用の音源が再生されたらstage.m4aを止める（探索画面に戻るまで） */
  function watchAudio(audioEl) {
    audioEl.addEventListener("play", () => {
      Bgm.hold(audioEl);
    });
    return audioEl;
  }

  /**
   * 1つの<audio>で「音源全体」や「文ごとの範囲」を再生するプレーヤー。
   * 終了位置の監視は約40msごとに行い、範囲を大きくはみ出さないようにする。
   */
  function createPlayer(audioEl) {
    let timer = null;
    let seq = 0;

    function clearTimer() { if (timer) { clearInterval(timer); timer = null; } }

    function ensureFile(file) {
      if (audioEl.dataset.fileId === file.id && audioEl.readyState >= 1) return Promise.resolve();
      return new Promise((resolve, reject) => {
        audioEl.dataset.fileId = file.id;
        const done = () => { audioEl.removeEventListener("loadedmetadata", onOk); audioEl.removeEventListener("error", onErr); };
        const onOk = () => { done(); resolve(); };
        const onErr = () => { done(); reject(new Error("音声を読み込めませんでした")); };
        audioEl.addEventListener("loadedmetadata", onOk);
        audioEl.addEventListener("error", onErr);
        audioEl.src = file.dataUrl;
      });
    }

    /** end が null なら最後まで再生する */
    async function playRange(file, start, end, onEnd) {
      const mySeq = ++seq;
      clearTimer();
      audioEl.pause();
      try {
        await ensureFile(file);
        if (mySeq !== seq) return;
        audioEl.currentTime = start || 0;
        await audioEl.play();
      } catch (err) {
        console.error("[dictationSystem] 音声の再生に失敗しました", err);
        Utils.showToast("音声を再生できませんでした", "error");
        return;
      }
      if (mySeq !== seq || end == null) return;
      timer = setInterval(() => {
        if (audioEl.currentTime >= end || audioEl.ended) {
          clearTimer();
          audioEl.pause();
          if (onEnd) onEnd();
        }
      }, 40);
    }

    function stop() { seq += 1; clearTimer(); audioEl.pause(); }

    return { playRange, stop };
  }

  function getById(id) {
    return getAll().find((s) => s.id === id) || null;
  }

  function createSet(title) {
    const id = Utils.generateId("dictset");
    GameState.update((state) => {
      if (!state.dictationSets) state.dictationSets = [];
      state.dictationSets.push({
        id,
        title: (title || "").trim().slice(0, 100) || "無題の教材",
        sentences: [],
        audioFiles: [],
        folderId: null,
        createdAt: Utils.todayStr(),
        updatedAt: Utils.todayStr(),
      });
    });
    return id;
  }

  function updateSet(id, patch) {
    GameState.update((state) => {
      const s = state.dictationSets.find((x) => x.id === id);
      if (!s) return;
      Object.assign(s, patch);
      s.updatedAt = Utils.todayStr();
    });
  }

  function deleteSet(id) {
    GameState.update((state) => {
      state.dictationSets = state.dictationSets.filter((s) => s.id !== id);
    });
  }

  /**
   * テキストを文単位に分割する（。！？.!? および改行を区切りとする簡易分割）。
   * 既存のsentencesがある場合は呼び出し側で確認（上書き注意）を行うこと。
   */
  function splitTextToSentences(text) {
    const normalized = text.replace(/\r\n/g, "\n").trim();
    if (!normalized) return [];
    const rough = normalized.split(/\n+/).flatMap((line) =>
      line.split(/(?<=[。！？.!?])/).map((s) => s.trim()).filter(Boolean)
    );
    return rough.filter(Boolean);
  }

  function setSentencesFromText(setId, text) {
    const sentences = splitTextToSentences(text).map((t) => ({
      id: Utils.generateId("sent"), text: t, audio: null,
    }));
    updateSet(setId, { sentences });
    return sentences.length;
  }

  function addAudioFiles(setId, files) {
    return Promise.all(files.map((file) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ id: Utils.generateId("audio"), name: file.name, dataUrl: reader.result });
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    }))).then((results) => {
      const valid = results.filter(Boolean);
      GameState.update((state) => {
        const s = state.dictationSets.find((x) => x.id === setId);
        if (!s) return;
        s.audioFiles.push(...valid);
        s.updatedAt = Utils.todayStr();
      });
      return valid.length;
    });
  }

  function round2(n) { return Math.round(n * 100) / 100; }

  function setSentenceAudio(setId, sentenceId, fileId, start, end) {
    GameState.update((state) => {
      const s = state.dictationSets.find((x) => x.id === setId);
      const sent = s?.sentences.find((x) => x.id === sentenceId);
      if (sent) sent.audio = { fileId, start: round2(start), end: round2(end) };
      if (s) s.updatedAt = Utils.todayStr();
    });
  }

  /* ============================================================
     ZIPバックアップ（音源・分割情報・フォルダをまとめて保存／復元）
     ============================================================ */

  const BACKUP_FORMAT = "gakushu-dictation-backup";

  function mimeOfDataUrl(dataUrl) {
    const m = /^data:([^;,]+)/.exec(dataUrl || "");
    return m ? m[1] : "application/octet-stream";
  }

  function extOfName(name, mime) {
    const m = /\.([A-Za-z0-9]{1,5})$/.exec(name || "");
    if (m) return "." + m[1].toLowerCase();
    if (mime === "audio/mpeg") return ".mp3";
    if (mime === "audio/mp4" || mime === "audio/x-m4a") return ".m4a";
    return ".bin";
  }

  async function dataUrlToBytes(dataUrl) {
    try {
      const res = await fetch(dataUrl);
      return new Uint8Array(await res.arrayBuffer());
    } catch (err) {
      // fetchでdata URLを扱えない環境向けのフォールバック
      const base64 = (dataUrl || "").split(",")[1] || "";
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
  }

  function bytesToDataUrl(bytes, mime) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("音源の変換に失敗しました"));
      reader.readAsDataURL(new Blob([bytes], { type: mime || "application/octet-stream" }));
    });
  }

  function downloadBlob(filename, blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /** すべての教材（音源・文の分割位置・フォルダ）をZIPで書き出す */
  async function exportBackupZip() {
    const sets = getAll();
    if (sets.length === 0) { Utils.showToast("書き出す教材がありません", "error"); return; }
    try {
      const entries = [];
      const manifestSets = [];
      for (const set of sets) {
        const audioMeta = [];
        for (const f of set.audioFiles || []) {
          const bytes = await dataUrlToBytes(f.dataUrl);
          const mime = mimeOfDataUrl(f.dataUrl);
          const path = `audio/${set.id}/${f.id}${extOfName(f.name, mime)}`;
          entries.push({ name: path, data: bytes });
          audioMeta.push({ id: f.id, name: f.name, mime, path });
        }
        manifestSets.push({
          id: set.id, title: set.title, folderId: set.folderId || null,
          sentences: set.sentences || [], audioFiles: audioMeta,
          createdAt: set.createdAt, updatedAt: set.updatedAt,
        });
      }
      const manifest = {
        format: BACKUP_FORMAT, version: 1, exportedAt: new Date().toISOString(),
        folders: GameState.getState().dictationFolders || [],
        sets: manifestSets,
      };
      entries.unshift({ name: "manifest.json", data: JSON.stringify(manifest, null, 2) });
      downloadBlob(`dictation_backup_${Utils.todayStr()}.zip`, ZipUtil.create(entries));
      Utils.showToast(`${sets.length}件の教材をZIPで書き出しました`, "success");
    } catch (err) {
      console.error("[dictationSystem] ZIPの書き出しに失敗しました", err);
      Utils.showToast("ZIPの書き出しに失敗しました: " + err.message, "error");
    }
  }

  /**
   * ZIPバックアップを読み込む。同じIDの教材は上書き、無いIDの教材は追加（他の教材は消えない）。
   * @returns {Promise<boolean>} 読み込みを実行したか（キャンセル・失敗はfalse）
   */
  async function importBackupZip(file) {
    try {
      const files = await ZipUtil.read(await file.arrayBuffer());
      const manifestBytes = files.get("manifest.json");
      if (!manifestBytes) throw new Error("manifest.json が見つかりません（このアプリで書き出したZIPではありません）");
      let manifest;
      try { manifest = JSON.parse(ZipUtil.textOf(manifestBytes)); }
      catch (e) { throw new Error("manifest.json の形式が正しくありません"); }
      if (manifest.format !== BACKUP_FORMAT || !Array.isArray(manifest.sets)) {
        throw new Error("音読ディクテーションのバックアップではありません");
      }

      const existingIds = new Set(getAll().map((x) => x.id));
      const overwriteCount = manifest.sets.filter((x) => existingIds.has(x.id)).length;
      if (overwriteCount > 0 && !(await uiConfirm(`同じ教材が${overwriteCount}件あります。ZIPの内容で上書きします。よろしいですか？`,'上書き'))) return false;

      const rebuilt = [];
      let missingAudio = 0;
      for (const m of manifest.sets) {
        if (!m || typeof m.id !== "string" || !Array.isArray(m.sentences)) throw new Error("教材データの形式が正しくありません");
        const audioFiles = [];
        for (const a of m.audioFiles || []) {
          const bytes = files.get(a.path);
          if (!bytes) { missingAudio += 1; continue; }
          audioFiles.push({ id: a.id, name: a.name, dataUrl: await bytesToDataUrl(bytes, a.mime) });
        }
        rebuilt.push({
          id: m.id, title: String(m.title || "無題の教材"), folderId: m.folderId || null,
          sentences: m.sentences, audioFiles,
          createdAt: m.createdAt || Utils.todayStr(), updatedAt: Utils.todayStr(),
        });
      }

      GameState.update((state) => {
        if (!state.dictationSets) state.dictationSets = [];
        if (!state.dictationFolders) state.dictationFolders = [];
        (Array.isArray(manifest.folders) ? manifest.folders : []).forEach((f) => {
          if (f && f.id && !state.dictationFolders.some((x) => x.id === f.id)) {
            state.dictationFolders.push({ id: f.id, name: String(f.name || "フォルダ"), open: f.open !== false });
          }
        });
        rebuilt.forEach((set) => {
          if (set.folderId && !state.dictationFolders.some((f) => f.id === set.folderId)) set.folderId = null;
          const idx = state.dictationSets.findIndex((x) => x.id === set.id);
          if (idx >= 0) state.dictationSets[idx] = set; else state.dictationSets.push(set);
        });
      });
      await GameState.persist();
      Utils.showToast(`${rebuilt.length}件の教材を読み込みました` + (missingAudio ? `（音源${missingAudio}件はZIP内に見つかりませんでした）` : ""), missingAudio ? "info" : "success");
      return true;
    } catch (err) {
      console.error("[dictationSystem] ZIPの読み込みに失敗しました", err);
      Utils.showToast("ZIPの読み込みに失敗しました: " + err.message, "error");
      return false;
    }
  }

  /* ============================================================
     教材の「追加／編集」ポップアップ（教材名・音読用テキスト・音源のアップロードを1画面で）
     set が null なら新規追加、教材を渡すと編集。
     ============================================================ */
  function rebuildSentences(setId, text) {
    const cur = getById(setId);
    if (!cur) return;
    const pool = (cur.sentences || []).slice();
    // 文面が同じ文は、これまでの音声位置をそのまま引き継ぐ
    const sentences = splitTextToSentences(text).map((t) => {
      const k = pool.findIndex((x) => x.text === t);
      if (k >= 0) return pool.splice(k, 1)[0];
      return { id: Utils.generateId("sent"), text: t, audio: null };
    });
    updateSet(setId, { sentences });
  }

  /** 一括保存：各文の「開始・終了（秒）」と音源の選択を、入力されている現状のまま全部保存する */
  function bulkSaveTimes(set, rows) {
    const patches = [];
    let invalid = 0;
    rows.forEach((r) => {
      const sv = r.startInput.value, ev = r.endInput.value;
      if (sv === "" && ev === "") return;                 // 未入力の文は対象外
      const st = parseFloat(sv) || 0, en = parseFloat(ev) || 0;
      if (en <= st) { invalid++; return; }
      patches.push({ id: r.sent.id, fileId: r.fileSelect.value, st, en });
    });
    if (patches.length) {
      GameState.update((state) => {
        const t = state.dictationSets.find((x) => x.id === set.id);
        if (!t) return;
        patches.forEach((p) => {
          const sent = t.sentences.find((x) => x.id === p.id);
          if (sent) sent.audio = { fileId: p.fileId, start: round2(p.st), end: round2(p.en) };
        });
        t.updatedAt = Utils.todayStr();
      });
    }
    if (patches.length === 0 && invalid === 0) Utils.showToast("保存する時間が入力されていません", "error");
    else if (invalid) Utils.showToast(`${patches.length}件を保存しました（${invalid}件は終了が開始より後ではないため保存していません）`, invalid && !patches.length ? "error" : "success");
    else Utils.showToast(`${patches.length}件の時間を一括保存しました`, "success");
  }

  function renderSentenceRow(set, sent, idx, reg, panel) {

  function renderListenScreen(root, params = {}) {
    const set = getById(params.setId);
    if (!set) { root.appendChild(Utils.el("p", { class: "empty-state" }, "教材が見つかりません")); return; }

    const wrap = Utils.el("div", { class: "screen-inner" });
    wrap.appendChild(Utils.el("h2", {}, set.title));

    const audioEl = watchAudio(Utils.el("audio", { controls: "true", style: "width:100%;" }));
    const player = createPlayer(audioEl);
    const originalFile = getOriginalAudioFile(set);

    let mode = null;      // "full"（分割前の音声）| "segment"（一文ずつ）
    let listened = 0;     // 分割前の音声を実際に聞いた秒数（シークで飛ばした分は数えない）
    let lastTime = 0;
    let fullCompleted = false;
    const rewardNote = Utils.el("p", { class: "explore-desc dict-reward-note" }, "");

    audioEl.addEventListener("timeupdate", () => {
      if (mode !== "full") return;
      const d = audioEl.currentTime - lastTime;
      if (d > 0 && d < 1.5) listened += d;
      lastTime = audioEl.currentTime;
    });
    audioEl.addEventListener("ended", () => {
      if (mode !== "full") return;
      // 通しで聞いた実時間が全体の9割以上のときだけ「最後まで再生した」と扱う
      if (audioEl.duration && listened >= audioEl.duration * 0.9) {
        fullCompleted = true;
        rewardNote.textContent = `最後まで聞きました。この画面を戻る／閉じると🪙${REWARD_LISTEN}個もらえます。`;
      }
    });

    const lineButtons = [];
    function highlight(activeBtn) {
      lineButtons.forEach((b) => b.classList.toggle("is-playing", b === activeBtn));
    }

    const topBtn = Utils.el("button", {
      class: "btn btn-moss btn-block",
      onclick: () => {
        if (!originalFile) { Utils.showToast("音源が登録されていません。編集画面でアップロードしてください", "error"); return; }
        mode = "full"; listened = 0; lastTime = 0; fullCompleted = false;
        rewardNote.textContent = "";
        highlight(null);
        player.playRange(originalFile, 0, null);
      },
    }, "▶ 練習する");
    wrap.appendChild(topBtn);
    wrap.appendChild(Utils.el("p", { class: "explore-desc" }, "上のボタンで分割前の音声を最初から再生します。下の文をタップすると、その一文だけを再生します。"));
    wrap.appendChild(audioEl);
    wrap.appendChild(rewardNote);

    const listBox = Utils.el("div", { class: "dict-listen-list" });
    if (set.sentences.length === 0) {
      listBox.appendChild(Utils.el("p", { class: "empty-state" }, "まだ一文分割されていません。教材の編集で音読用テキストを入力してください。"));
    }
    set.sentences.forEach((sent, idx) => {
      const file = sent.audio ? set.audioFiles.find((f) => f.id === sent.audio.fileId) : null;
      const playable = !!(sent.audio && file);
      const btn = Utils.el("button", {
        class: "panel dict-sentence-btn" + (playable ? "" : " is-disabled"),
        disabled: !playable || undefined,
        onclick: () => {
          mode = "segment";
          highlight(btn);
          player.playRange(file, sent.audio.start, sent.audio.end, () => highlight(null));
        },
      }, [
        Utils.el("span", { class: "dict-sentence-no" }, `${idx + 1}`),
        Utils.el("span", { class: "dict-sentence-text" }, sent.text),
        playable ? null : Utils.el("span", { class: "dict-sentence-note" }, "（音声未設定）"),
      ]);
      lineButtons.push(btn);
      listBox.appendChild(btn);
    });
    wrap.appendChild(listBox);

    // 戻る／閉じる／パンくずで画面を離れるときの共通処理（音を止め、条件を満たしていれば報酬を付与）
    Router.onLeave(() => {
      player.stop();
      if (fullCompleted) {
        const granted = claimReward(set.id, "listen", REWARD_LISTEN);
        if (granted > 0) Utils.showToast(`🪙 コインを${granted}個獲得しました`, "success");
        else Utils.showToast("この教材の「音読」の報酬は、今日はすでに受け取り済みです", "info");
      }
    });
    wrap.appendChild(Utils.el("button", { class: "btn btn-moss btn-block dict-btn-gap", onclick: () => scBack() }, "編集画面に戻る"));

    root.appendChild(wrap);
  }

  /* ============================================================
     画面："dictationPractice"（ディクテーション：一文ずつ聞き取って入力）
     ============================================================ */

  function renderPracticeScreen(root, params = {}) {
    const set = getById(params.setId);
    if (!set) { root.appendChild(Utils.el("p", { class: "empty-state" }, "教材が見つかりません")); return; }
    const playable = set.sentences.filter((s) => s.audio);
    if (playable.length === 0) {
      root.appendChild(Utils.el("p", { class: "empty-state" }, "音声が対応付けられた文がありません。先に教材の編集で音声を設定してください。"));
      return;
    }

    const wrap = Utils.el("div", { class: "screen-inner" });
    wrap.appendChild(Utils.el("h2", {}, set.title));

    let index = 0;
    let showingText = false;
    // 各文の「最初の答え合わせ」の結果（全問正解の判定に使う）。答えを見てから答え合わせした文は不正解扱い。
    const results = new Map();   // sentenceId → correct(boolean)
    const peeked = new Set();    // 答え合わせ前に「答えを見る」を使った文

    const audioEl = watchAudio(Utils.el("audio", { controls: "true", style: "width:100%;" }));
    const player = createPlayer(audioEl);
    const counter = Utils.el("div", { class: "flashcard-counter" }, "");
    const progress = Utils.el("p", { class: "explore-desc dict-reward-note" }, "");
    const textBox = Utils.el("div", { class: "panel" });
    const answerInput = Utils.el("input", { type: "text", class: "review-typing-input", placeholder: "聞き取った内容を入力" });
    const judgeBox = Utils.el("div", {});

    function isAllAnswered() { return results.size >= playable.length; }
    function isAllCorrect() { return isAllAnswered() && [...results.values()].every(Boolean); }

    function updateProgress() {
      let text = `解答済み ${results.size} / ${playable.length}`;
      if (isAllAnswered()) {
        text += isAllCorrect()
          ? `　全問正解です！この画面を戻る／閉じると🪙${REWARD_DICTATION_PERFECT}個もらえます。`
          : `　最後まで解きました。この画面を戻る／閉じると🪙${REWARD_DICTATION}個もらえます。`;
      }
      progress.textContent = text;
    }

    function render() {
      const sent = playable[index];
      counter.textContent = `${index + 1} / ${playable.length}`;
      textBox.innerHTML = "";
      textBox.appendChild(Utils.el("p", {}, showingText ? sent.text : "（再生して聞き取ってください。「答えを見る」で表示）"));
      answerInput.value = "";
      judgeBox.innerHTML = "";
      updateProgress();
    }

    const playBtn = Utils.el("button", {
      class: "btn btn-moss",
      onclick: () => {
        const sent = playable[index];
        const file = set.audioFiles.find((f) => f.id === sent.audio.fileId);
        if (!file) { Utils.showToast("この文の音源が見つかりません", "error"); return; }
        player.playRange(file, sent.audio.start, sent.audio.end);
      },
    }, "▶ この文を再生");

    const checkBtn = Utils.el("button", {
      class: "btn btn-secondary",
      onclick: () => {
        const sent = playable[index];
        const isCorrect = answerInput.value.trim() === sent.text.trim();
        if (!results.has(sent.id)) results.set(sent.id, isCorrect && !peeked.has(sent.id));
        judgeBox.innerHTML = "";
        judgeBox.appendChild(Utils.el("p", {}, isCorrect ? "正解！" : `正しくは: ${sent.text}`));
        updateProgress();
      },
    }, "答え合わせ");

    const showBtn = Utils.el("button", {
      class: "btn btn-secondary",
      onclick: () => {
        const sent = playable[index];
        if (!showingText && !results.has(sent.id)) peeked.add(sent.id);
        showingText = !showingText;
        render();
      },
    }, "答えを見る");

    const navRow = Utils.el("div", { class: "quiz-choice-row" }, [
      Utils.el("button", { class: "btn btn-secondary", onclick: () => { index = (index - 1 + playable.length) % playable.length; showingText = false; render(); } }, "← 前の文"),
      Utils.el("button", { class: "btn btn-secondary", onclick: () => { index = (index + 1) % playable.length; showingText = false; render(); } }, "次の文 →"),
    ]);

    wrap.appendChild(counter);
    wrap.appendChild(progress);
    wrap.appendChild(Utils.el("p", { class: "explore-desc" }, "全問正解の判定は、各文の最初の答え合わせで決まります。答えを見てから答え合わせした文は不正解として扱われます。"));
    wrap.appendChild(audioEl);
    wrap.appendChild(Utils.el("div", { class: "quiz-choice-row" }, [playBtn, showBtn]));
    wrap.appendChild(textBox);
    wrap.appendChild(answerInput);
    wrap.appendChild(checkBtn);
    wrap.appendChild(judgeBox);
    wrap.appendChild(navRow);
    Router.onLeave(() => {
      player.stop();
      if (isAllAnswered()) {
        const amount = isAllCorrect() ? REWARD_DICTATION_PERFECT : REWARD_DICTATION;
        const granted = claimReward(set.id, "dictation", amount);
        if (granted > 0) Utils.showToast(`🪙 コインを${granted}個獲得しました`, "success");
        else Utils.showToast("この教材のディクテーション報酬は、今日はすでに受け取り済みです", "info");
      }
    });
    wrap.appendChild(Utils.el("button", { class: "btn btn-moss btn-block", style: "margin-top:16px;", onclick: () => scBack() }, "編集画面に戻る"));

    render();
    root.appendChild(wrap);
  }

  Router.registerScreen("dictationList", renderListScreen);
  Router.registerScreen("dictationDetail", renderDetailScreen);
  Router.registerScreen("dictationListen", renderListenScreen);
  Router.registerScreen("dictationPractice", renderPracticeScreen);

  return {
    getAll, getById, createSet, updateSet, deleteSet,
    splitTextToSentences, setSentencesFromText, addAudioFiles,
    setSentenceAudio,
    exportBackupZip, importBackupZip, getOriginalAudioFile,
  };
})();

else{if(!e)return uiAlert('絵文字か画像ファイルを指定してください');if(trees().some(t=>t[0]==e))return uiAlert('その絵文字はすでに登録されています');S.customTrees.push([e,n,c])}

${[0,1,2,3].map(i=>{const u=set[i]||'',im=isDataImg(u);return `<div class="stg-row"><b style="width:44px">${DSTG[i]}</b><input class="stem" placeholder="${STG[i]}" maxlength="8" value="${esc(im?'':u)}" onchange="stEmoji(${i},this.value)"><span style="font-size:22px">${im?vHtml(u,26):''}</span><button type="button" class="btn g" onclick="this.nextElementSibling.click()">🖼 画像</button><input type="file" accept="image/*" style="display:none" onchange="stImg(this,${i})"><button type="button" class="btn g" onclick="stSet(${i},'')">戻す</button></div>`}).join('')}
<button type="button" class="btn g" style="width:100%;margin-top:6px" onclick="stResetAll()">この樹種の指定をすべて戻す</button>`}
function stSet(i,v){const tr=STGUI.tr||S.sel;if(!S.stageSet||typeof S.stageSet!='object')S.stageSet={};const a=(S.stageSet[tr]||['','','','']).slice(0,4);while(a.length<4)a.push('');a[i]=v||'';

/* ===== バックアップ：JSON／ZIP（backup.json＋audio/） ===== */
const snapExport=()=>{const o=JSON.parse(JSON.stringify(snap(),(k,v)=>k==='dataUrl'?undefined:v));try{delete o.user.settings.github.token}catch(e){}try{delete o.team.pw}catch(e){}return o};
async function dataUrlBytes(u){try{return new Uint8Array(await(await fetch(u)).arrayBuffer())}catch(e){const b=atob((u||'').split(',')[1]||''),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}}
const bytesDataUrl=(b,m)=>new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ng(new Error('音源の変換に失敗しました'));r.readAsDataURL(new Blob([b],{type:m||'application/octet-stream'}))});
async function exportZip(){try{const ent=[],aud=[];
for(const s of S.dictationSets)for(const f of s.audioFiles||[]){if(!f.dataUrl)continue;const mime=(/^data:([^;,]+)/.exec(f.dataUrl)||[])[1]||'application/octet-stream',ext=(/\.[A-Za-z0-9]{1,5}$/.exec(f.name||'')||['.bin'])[0].toLowerCase(),p=`audio/${s.id}/${f.id}${ext}`;
ent.push({name:p,data:await dataUrlBytes(f.dataUrl)});aud.push({id:f.id,setId:s.id,path:p,mime})}
const o=snapExport();o.__audio=aud;o.__format='shukan-no-mori-backup';o.__v=1;ent.unshift({name:'backup.json',data:JSON.stringify(o)});
dl('shukan_no_mori_backup_'+iso(kd(new Date()))+'.zip',ZipUtil.create(ent),'application/zip');toast('ZIPを書き出しました（音源'+aud.length+'件）')}
catch(e){console.error(e);uiAlert('ZIPの書き出しに失敗しました: '+e.message)}}
async function restore(t,files){try{const o=typeof t=='string'?JSON.parse(t):t;if(!o||typeof o!='object'||Array.isArray(o)||(o.R&&!Array.isArray(o.R)))throw new Error('形式が不正です');
if(!await uiConfirm('現在のデータをバックアップの内容で上書きします。よろしいですか？','復元する'))return;
const aud=o.__audio;delete o.__audio;delete o.__format;delete o.__v;const tk=((S.user||{}).settings||{}).github;const oldTok=tk&&tk.token;
const oldPw=S.team&&S.team.pw,oldTid=S.team&&S.team.tid;Object.assign(S,o);ensure();const g=S.user.settings.github;if(!g.token&&oldTok)g.token=oldTok;if(!S.team.pw&&oldPw&&S.team.tid==oldTid)S.team.pw=oldPw;pomoSaveLS();
if(aud&&files)for(const a of aud){const b=files.get(a.path);if(!b)continue;const du=await bytesDataUrl(b,a.mime);for(const s of S.dictationSets)for(const f of s.audioFiles||[])if(f.id==a.id)f.dataUrl=du}
await hydrateAudio();await flush();render();toast('復元しました')}catch(e){console.error(e);uiAlert('バックアップを読み込めません：'+e.message)}}
async function rdAny(i){const f=i.files[0];i.value='';if(!f)return;
try{if(/\.zip$/i.test(f.name)||f.type=='application/zip'){const fl=await ZipUtil.read(await f.arrayBuffer()),b=fl.get('backup.json');if(!b)throw new Error('ZIP内に backup.json がありません');await restore(ZipUtil.textOf(b),fl)}
else await restore(await f.text())}catch(e){uiAlert('読み込みに失敗しました：'+e.message)}}

/* =====================================================================
   要望書 追加仕様（1〜5章）
   1 ポモドーロ拡張 / 2 効果音・BGM・オフライン / 3 途中停止ペナルティ /
   4 タスク3分類 / 5 木とタスクの紐づけ
   （旧実装の home / tog / startT などはこのブロックの定義に置き換え済み）
   ===================================================================== */
const WD='日月火水木金土',WDO=[1,2,3,4,5,6,0];
const PEN_FREE=2,PEN_MIN=5,PEN_COST=5;   // 3回目以降の中断で5分ロック／5コインで解除
const CAT={rt:['ルーティーン','#2e7d4f'],tk:['ToDo','#f59e0b']};
const clampInt=(v,a,b,d)=>{v=Math.round(+v);return isFinite(v)?Math.min(b,Math.max(a,v)):d};
const hmNow=()=>new Date().toTimeString().slice(0,5);
const isDue=(r,d)=>!r.days||!r.days.length||r.days.includes((d||today).getDay());
const due=()=>S.R.filter(r=>isDue(r,today));
const daysLabel=r=>!r.days||!r.days.length||r.days.length>=7?'毎日':WDO.filter(w=>r.days.includes(w)).map(w=>WD[w]).join('・');
const tagsOf=x=>x&&x.tags&&x.tags.length?x.tags:['未分類'];
const allTags=()=>[...new Set([...S.R,...S.T].flatMap(tagsOf))];
const MULTI_TAG='反復',STUDY_TAG='継続';
const isMulti=r=>!!r&&tagsOf(r).includes(MULTI_TAG);   // ルーティーンは「反復」タグ付きだけ1日に複数回達成できる
const isStudyBgm=x=>!!x&&tagsOf(x).some(t=>t==STUDY_TAG||t=='勉強');   // 勉強／継続タグ付きは作業BGMに勉強用.mp3
const isStudy=x=>!!x&&tagsOf(x).includes(STUDY_TAG);   // 「継続」タグ付きは完了時にグループへ自動投稿
/* ---------- その日の木：ルーティーン／ToDoの達成率で育ち、日付が変わった時点で確定 ----------
   20%：種 → 40%：若木 → 60%：成長 → 80%：つぼみ → 100%：満開（ルーティーンとToDoで別々に1本ずつ） */
const DSTG=['種','若木','成長','つぼみ','満開'];
const rateStage=p=>p==null?-1:p>=100?4:p>=80?3:p>=60?2:p>=40?1:p>=20?0:-1;
const rtRate=(n,t)=>t?Math.round(n/t*100):null;
function dailyRates(){const du=due();return{rt:rtRate(du.filter(r=>r.done).length,du.length),tk:rtRate(S.T.filter(t=>t.c>0).length,S.T.length)}}
function dayTrees(rt,tk,at,prov){const o=[];[['rt',rt],['tk',tk]].forEach(a=>{const g=rateStage(a[1]);if(g<0)return;
const tk=treeEm(g);o.push({e:isDataImg(tk)?STG[g]:tk,tr:S.sel,n:CAT[a[0]][0]+' '+a[1]+'%（'+DSTG[g]+'）',tags:[CAT[a[0]][0]],cat:a[0],rate:a[1],stg:g,at,kind:'daily',prov:prov?1:0})});return o}
const liveTrees=()=>{const r=dailyRates();return dayTrees(r.rt,r.tk,Date.now(),1)};
function dailyToast(){const r=dailyRates(),f=(l,p)=>{if(p==null)return '';const g=rateStage(p);return l+' '+p+'%'+(g>=0?'→'+emTxt(treeEm(g),STG[g])+DSTG[g]:'')};toast('🌱 '+[f('ルーティーン',r.rt),f('ToDo',r.tk)].filter(Boolean).join(' ／ '))}
function dayTreeCard(){const r=dailyRates(),it=[['rt',r.rt],['tk',r.tk]].filter(a=>a[1]!=null);if(!it.length)return '';
return `<div class="card" data-tu="daytree"><div class="row"><b class="sp">🌱 今日の木</b><span class="sm">日付が変わると確定します</span></div>${it.map(a=>{const g=rateStage(a[1]);return `<div class="row" style="margin-top:6px"><span style="font-size:28px;width:36px;text-align:center">${g>=0?vHtml(treeEm(g)):'・'}</span><div class="sp"><div class="sm">${CAT[a[0]][0]} ${a[1]}%</div><b>${g>=0?DSTG[g]:'まだ植わっていません（20%で種）'}</b></div><div class="sm" style="font-size:16px;white-space:nowrap">${[0,1,2,3,4].map(i=>`<span style="opacity:${i<=g?1:.3}">${vHtml(treeEm(i))}</span>`).join('')}</div></div>`}).join('')}</div>`}
function plantTree(x,kind,isT){S.forest.push({e:S.sel,n:x.n,tags:tagsOf(x),rid:isT?null:x.id,tid:isT?x.id:null,at:Date.now(),kind})}   // 達成＝木を1本植える
function unplant(key,id){for(let i=S.forest.length-1;i>=0;i--){const f=S.forest[i];if(f&&typeof f=='object'&&f[key]==id&&f.kind!='abort'){S.forest.splice(i,1);return}}}
function cumAdd(kind,x,n){const c=S.cum;for(const t of tagsOf(x))c[kind][t]=Math.max(0,(c[kind][t]||0)+n);c.n[kind]=Math.max(0,(c.n[kind]||0)+n)}
function tagPicker(sel,pin){const all=[...new Set([...(pin||[]),...allTags(),...sel])];
return `<div class="row" id="tgp" style="flex-wrap:wrap;gap:6px;margin-bottom:6px">${all.map(t=>`<button type="button" class="chip ${sel.includes(t)?'on':''}" data-t="${esc(t)}" onclick="this.classList.toggle('on')">${esc(t)}</button>`).join('')}</div><input id="tgn" placeholder="新しいタグを追加（「、」や空白で区切って複数OK）">`}
function tgHelp(){const e=$('#tghelp');if(e)e.style.display=e.style.display=='none'?'block':'none'}
function readTags(){const on=[...document.querySelectorAll('#tgp .chip.on')].map(b=>b.dataset.t),nw=($('#tgn').value||'').split(/[、,，\s]+/).map(s=>s.trim().slice(0,12)).filter(Boolean),t=[...new Set([...on,...nw])].slice(0,6);return t.length?t:['未分類']}
function setTagF(k,t){S[k]=t;render()}
function tagChips(key,items){const tags=['すべて',...new Set(items.flatMap(tagsOf))],cur=tags.includes(S[key])?S[key]:'すべて';
return `<div class="chips">${tags.map(t=>`<button class="chip ${cur==t?'on':''}" data-t="${esc(t)}" onclick="setTagF('${key}',this.dataset.t)">${esc(t)}</button>`).join('')}</div>`}

const fE=x=>typeof x=='string'?x:(x&&x.e)||'🌳';
function actInc(kind,n,min){const k=kd(today),a=S.act[k]||(S.act[k]={rt:0,tk:0,td:0,m:0});
if(kind)a[kind]=Math.max(0,(a[kind]||0)+(n==null?1:n));if(min)a.m=Math.max(0,(a.m||0)+min)}
function weekData(){const o=[];for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);const k=kd(d),a=S.act[k],h=S.hist[k],md=(d.getMonth()+1)+'/'+d.getDate();
o.push(a?{k,w:d.getDay(),md,rt:a.rt||0,tk:(a.tk||0)+(a.td||0),td:0,m:a.m||0}:{k,w:d.getDay(),md,rt:h?h.d||0:0,tk:0,td:0,m:h?h.m||0:0})}return o}

function pomoNorm(){const p=S.pomo&&typeof S.pomo=='object'?S.pomo:(S.pomo={});p.work=clampInt(p.work,1,180,25);p.rest=clampInt(p.rest,1,60,5);p.loop=!!p.loop;p.bgmWork=p.bgmWork===undefined?p.bgm!==false:p.bgmWork!==false;p.bgmRest=p.bgmRest===undefined?p.bgm!==false:p.bgmRest!==false;p.bgm=p.bgmWork||p.bgmRest}
function pomoLoadLS(){try{const o=JSON.parse(localStorage.getItem(PLS)||'null');if(o&&typeof o=='object'){S.pomo.work=o.work;S.pomo.rest=o.rest;S.pomo.loop=o.loop;S.pomo.bgm=o.bgm;S.pomo.bgmWork=o.bgmWork;S.pomo.bgmRest=o.bgmRest}}catch(e){}pomoNorm()}

const Assets=(()=>{const N={in:'in.mp3',out:'out.mp3',task:'task.mp3',rest:'rest.mp3',study:'勉強用.mp3',off:'off.mp3'},U={},P={};
const idbGet=k=>new Promise(ok=>{try{if(!DB)return ok(null);const r=DB.transaction('kv').objectStore('kv').get('asset_'+k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)}catch(e){ok(null)}});
const idbPut=(k,b)=>{try{if(DB)DB.transaction('kv','readwrite').objectStore('kv').put(b,'asset_'+k)}catch(e){}};
const okType=b=>!!b&&b.size>0&&!/text\/html|json/.test(b.type||'');
async function net(k,old){try{const r=await fetch(N[k],{cache:'no-cache'});if(!r.ok)return null;const b=await r.blob();if(!okType(b))return null;if(!old||old.size!==b.size)idbPut(k,b);return b}catch(e){return null}}
function load(k){return P[k]||(P[k]=(async()=>{let b=await idbGet(k);if(okType(b)){net(k,b);}else{b=await net(k,null)}
U[k]=okType(b)?URL.createObjectURL(b):N[k];return U[k]})())}
return{load,preload:()=>Promise.all(Object.keys(N).map(load)),url:k=>U[k]||N[k]}})();
const Sfx=(()=>{let ac=null;const buf={};
const ctx=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();return ac}catch(e){return null}};
function synth(k){const c=ctx();if(!c)return;try{const t=c.currentTime,o=c.createOscillator(),g=c.createGain(),f=k=='in'?[523,1047]:[1047,523];
o.type='sine';o.frequency.setValueAtTime(f[0],t);o.frequency.exponentialRampToValueAtTime(f[1],t+.35);
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.55)}catch(e){}}
async function getBuf(k){if(buf[k]!==undefined)return buf[k];const c=ctx();if(!c)return null;
try{const u=await Assets.load(k);buf[k]=await c.decodeAudioData(await(await fetch(u)).arrayBuffer())}catch(e){buf[k]=null}return buf[k]}
return{unlock(){ctx()},async play(k){const c=ctx();if(!c)return;const b=await getBuf(k);
if(b){const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=.9;s.connect(g);g.connect(c.destination);s.start();return}
try{const a=new Audio(Assets.url(k));a.addEventListener('error',()=>synth(k));const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){synth(k)}}}})();

/* =====================================================================
   6. チーム機能（別端末のメンバーと共有）
   ・サーバーは Firebase Realtime Database の REST API（SDK不要）。URLを設定画面/チーム画面で入力。
   ・データはチームのパスワードから作った鍵で端末内で暗号化(AES-GCM)してから送るため、
     サーバー側ではチームIDを知っていても中身は読めない。
   ・未参加のときは、従来どおりの1人用デモ表示になる。
   ===================================================================== */
const TEAM_DB_DEFAULT='';   // 共通のサーバーURLをここに入れると、参加者はURL入力が不要になります
let TP=[],TMEM={},TLAST=0,TSIG='',TBUSY=false,TERR='',DRAFT='',MEMV=null,MEMM='n',TPUSHT=null;
const teamOn=()=>!!(S.team&&S.team.db&&S.team.tid&&S.team.pw&&S.team.uid);
const safeImg=u=>/^(https?:|data:image\/)/.test(u||'')?u:'';
const rndId=n=>{const A='abcdefghijklmnopqrstuvwxyz0123456789',a=crypto.getRandomValues(new Uint8Array(n));return [...a].map(x=>A[x%A.length]).join('')};
const TeamAPI=(()=>{const enc=new TextEncoder(),dec=new TextDecoder(),kc={};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const need=()=>{if(!(window.crypto&&crypto.subtle))throw new Error('この環境では暗号化が使えません（https または localhost で開いてください）')};
async function key(tid,pw){need();const id=tid+'\n'+pw;if(kc[id])return kc[id];
const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
return kc[id]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('shukan-no-mori:'+tid),iterations:120000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(tid,pw,o){const k=await key(tid,pw),iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(o))));
const u=new Uint8Array(12+ct.length);u.set(iv);u.set(ct,12);return b64(u)}
async function unseal(tid,pw,s){const k=await key(tid,pw),u=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12))))}
async function http(db,path,method,body,qs){if(TUTSB&&method&&method!='GET')return null;   // チュートリアル中はサーバーへ書き込まない
const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);
try{const r=await fetch(db.replace(/\/+$/,'')+path+'.json'+(qs||''),{method:method||'GET',body:body===undefined?undefined:JSON.stringify(body),signal:c.signal,headers:body===undefined?undefined:{'Content-Type':'application/json'}});
if(!r.ok)throw new Error('サーバーエラー('+r.status+')。URLとデータベースのルールを確認してください');return await r.json()}
catch(e){if(e.name=='AbortError'||e instanceof TypeError)throw new Error('サーバーに接続できません');throw e}finally{clearTimeout(t)}}
const gid=n=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=crypto.getRandomValues(new Uint8Array(n));return [...a].map(x=>A[x%A.length]).join('')};
const T=()=>S.team,base=()=>'/teams/'+T().tid;
const cleanTi=o=>{const r={};if(o&&typeof o=='object')Object.keys(o).slice(0,12).forEach(k=>{if(/^(img|st):[\w:-]{1,40}$/.test(k)&&isDataImg(o[k])&&o[k].length<=12000)r[k]=o[k]});return r};
return{
async create(db,name){need();const tid='MORI-'+gid(6),pw=gid(8);
await http(db,'/teams/'+tid+'/meta','PUT',{v:await seal(tid,pw,{ok:'shukan'}),n:await seal(tid,pw,{name})});return{tid,pw}},
async verify(db,tid,pw){need();const m=await http(db,'/teams/'+tid+'/meta');if(!m||!m.v)throw new Error('そのチームIDは見つかりません');
try{await unseal(tid,pw,m.v)}catch(e){throw new Error('パスワードが違います')}
let name='チーム';try{name=(await unseal(tid,pw,m.n)).name||name}catch(e){}return{name}},
async putMe(obj){const t=T();await http(t.db,base()+'/members/'+t.uid,'PUT',await seal(t.tid,t.pw,obj))},
async delMe(){const t=T();await http(t.db,base()+'/members/'+t.uid,'DELETE')},
async members(){const t=T(),o=await http(t.db,base()+'/members')||{},out={};
for(const u of Object.keys(o)){if(!/^[A-Za-z0-9_]+$/.test(u))continue;try{const m=await unseal(t.tid,t.pw,o[u]);
out[u]={name:String(m.name||'メンバー').slice(0,12),icon:icoNorm(m.icon),week:Array.isArray(m.week)?m.week.slice(0,7):[],forest:Array.isArray(m.forest)?m.forest.slice(-36).map(x=>x&&typeof x=='object'?x:{e:String(x||'🌳').slice(0,8)}):[],ti:cleanTi(m.ti),fc:+m.fc||0,upd:+m.upd||0}}catch(e){}}return out},
async post(obj){const t=T();return await http(t.db,base()+'/posts','POST',{c:await seal(t.tid,t.pw,obj)})},
async posts(){const t=T(),o=await http(t.db,base()+'/posts','GET',undefined,'?orderBy=%22%24key%22&limitToLast=120')||{},out=[];
for(const id of Object.keys(o)){try{const p=await unseal(t.tid,t.pw,o[id].c);

const d=document.createElement('div');d.id='tut';d.innerHTML='<div class="tutb"></div><div class="tutb"></div><div class="tutb"></div><div class="tutb"></div><div class="tuth" style="display:none"></div><div class="tutbub"></div>';document.body.appendChild(d);
document.addEventListener('click',tutClick,true);document.addEventListener('keydown',tutKey,true);window.addEventListener('resize',tutPlace);document.addEventListener('scroll',tutPlace,true);
TUT.iv=setInterval(tutPlace,250);tutGo(0)}
function tutGo(i){if(!TUT.on)return;if(i<0)i=0;if(i>=TUT_STEPS.length)return tutEnd('done');TUT.i=i;const my=++TUT.n,st=TUT_STEPS[i];tutReset();
try{st.pre&&st.pre()}catch(e){console.error(e)}
tutBubble();tutPlace();
setTimeout(()=>{if(!TUT.on||my!=TUT.n)return;const el=tutEls(st);if(el.length){try{el[0].scrollIntoView({block:'center',inline:'nearest'})}catch(e){}}tutPlace()},90)}
function tutBubble(){const st=TUT_STEPS[TUT.i],b=$('#tut .tutbub'),N=TUT_STEPS.length,last=TUT.i==N-1;if(!b||!st)return;
b.innerHTML=`<div class="tutarr" style="display:none"></div><div class="tuthd">${st.ch?`<span class="tutch">STEP ${st.ch}/${TUT_N}</span>`:''}<b>${esc(st.t)}</b></div><div class="tuttx">${esc(st.x)}</div>${st.tg?`<div class="tuthint">👆 光っている部分をタップ${st.pass?'（実際に操作）':''}しても進みます</div>`:''}<div class="tutbar"><i style="width:${Math.round(TUT.i/(N-1)*100)}%"></i></div><div class="tutbtns">${last?'':`<button class="btn g" onclick="tutEnd('skip')">スキップ</button>`}<span class="sp"></span>${TUT.i?`<button class="btn g" onclick="tutGo(TUT.i-1)">← 戻る</button>`:''}<button class="btn" onclick="${last?`tutEnd('done')`:`tutGo(TUT.i+1)`}">${last?'完了':'次へ'}</button></div>`}
function tutPlace(){if(!TUT.on)return;const root=$('#tut'),st=TUT_STEPS[TUT.i];if(!root||!st)return;
const vw=innerWidth,vh=innerHeight;let r=null;
tutEls(st).forEach(e=>{const b=e.getBoundingClientRect();if(b.width<2&&b.height<2)return;r=r?{l:Math.min(r.l,b.left),t:Math.min(r.t,b.top),r:Math.max(r.r,b.right),b:Math.max(r.b,b.bottom)}:{l:b.left,t:b.top,r:b.right,b:b.bottom}});
if(r){const P=6;r.l=Math.max(0,r.l-P);r.t=Math.max(0,r.t-P);r.r=Math.min(vw,r.r+P);r.b=Math.min(vh,r.b+P);if(r.r-r.l<8||r.b-r.t<8)r=null}
TUT.rect=r;const bl=root.querySelectorAll('.tutb'),hole=root.querySelector('.tuth'),set=(e,l,t,w,h)=>{e.style.left=l+'px';e.style.top=t+'px';e.style.width=Math.max(0,w)+'px';e.style.height=Math.max(0,h)+'px'};
if(!r){set(bl[0],0,0,vw,vh);for(let k=1;k<4;k++)set(bl[k],0,0,0,0);hole.style.display='none'}
else{set(bl[0],0,0,vw,r.t);set(bl[1],0,r.t,r.l,r.b-r.t);set(bl[2],r.r,r.t,vw-r.r,r.b-r.t);set(bl[3],0,r.b,vw,vh-r.b);hole.style.display='block';set(hole,r.l,r.t,r.r-r.l,r.b-r.t)}
tutBub(r)}
function tutBub(r){const b=$('#tut .tutbub');if(!b)return;const vw=innerWidth,vh=innerHeight,M=8,bw=b.offsetWidth,bh=b.offsetHeight,ar=b.querySelector('.tutarr');let l,t,mode='';
if(!r){l=(vw-bw)/2;t=(vh-bh)/2}
else{const below=vh-r.b-M-10,above=r.t-M-10;
if(below>=bh){t=r.b+10;mode='dn'}else if(above>=bh){t=r.t-bh-10;mode='up'}else{t=below>=above?vh-bh-M:M}   // どちらにも入らないときは、広い側に寄せて画面内に収める
l=(r.l+r.r)/2-bw/2}
l=Math.min(Math.max(M,l),vw-bw-M);t=Math.min(Math.max(M,t),vh-bh-M);b.style.left=l+'px';b.style.top=t+'px';
if(ar){if(mode&&r){ar.className='tutarr '+mode;ar.style.left=(Math.min(Math.max(16,(r.l+r.r)/2-l),bw-16)-7)+'px';ar.style.display='block'}else ar.style.display='none'}}
function tutClick(e){if(!TUT.on)return;const t=e.target;if(t&&t.closest&&(t.closest('#tut')||t.closest('#dg')))return;
const r=TUT.rect,st=TUT_STEPS[TUT.i],x=e.clientX,y=e.clientY;
if(!r||!st||!st.tg||!(x||y)||x<r.l||x>r.r||y<r.t||y>r.b){e.stopPropagation();e.preventDefault();return}   // 光っている部分の外・プログラム由来のクリックは無効
if(!st.pass){e.stopPropagation();e.preventDefault()}   // pass が無いステップは、操作は実行せず「進む」だけ
const i=TUT.i;setTimeout(()=>{if(TUT.on&&TUT.i==i)tutGo(i+1)},st.pass?500:0)}
function tutKey(e){if(TUT.on&&e.key=='Escape'){e.stopPropagation();tutEnd('skip')}}
function tutEnd(how){if(!TUT.on)return;TUT.on=0;TUT.n++;clearInterval(TUT.iv);
document.removeEventListener('click',tutClick,true);document.removeEventListener('keydown',tutKey,true);window.removeEventListener('resize',tutPlace);document.removeEventListener('scroll',tutPlace,true);
const d=$('#tut');if(d)d.remove();tutCloseScreen();
for(const k in TUT.bk)S[k]=TUT.bk[k];TUT.bk=null;S.modal='';S.ed=0;for(const k in ACC)delete ACC[k];Object.assign(ACC,TUT.acc0);   // 操作前の状態に戻す
TUTSB=false;tutLS.set(TUT_KEY,how=='done'?'done':'skip');tutLS.del(TUT_AUTO);
render();toast(how=='done'?'チュートリアルを完了しました（マイページからいつでも見直せます）':'チュートリアルを終了しました（マイページから見直せます）')}

/* ===== 起動 ===== */
async function boot(){$('#m').innerHTML='<p class="sm" style="text-align:center;margin-top:40px">読み込み中…</p>';
try{await loadState()}catch(e){console.error(e);ensure()}
pomoLoadLS();pomoSaveLS();ready=true;checkDay();render();rvCheck();flush();tutAuto();
setTimeout(()=>{Assets.preload();SWreg()},800);if(teamOn())setTimeout(teamPush,2500);
setInterval(penTick,1000);setInterval(()=>{if(teamOn()&&S.tab=='team'&&!document.hidden)teamPull()},15000);
setInterval(()=>{if(checkDay()&&!S.modal&&!SC.n)render();remind();rvCheck()},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();else{rvCheck();if(checkDay()&&!S.modal&&!SC.n)render()}});
addEventListener('beforeunload',()=>{flush()});
addEventListener('pagehide',()=>{flush()})}
boot();
</script></body></html>
