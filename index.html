        Router.navigate("dictationDetail", { setId: set.id });
      },
    }, "編集画面に戻る"));

    render();
    root.appendChild(wrap);
  }

  Router.registerScreen("dictationList", renderListScreen);
  Router.registerScreen("dictationDetail", renderDetailScreen);
  Router.registerScreen("dictationListen", renderListenScreen);
  Router.registerScreen("dictationPractice", renderPracticeScreen);

  return {
    getAll, getById, createSet, updateSet, deleteSet,
    splitTextToSentences, setSentencesFromText, addAudioFiles,
    autoSplitByCharCount, setSentenceAudio,
    exportBackupZip, importBackupZip, getOriginalAudioFile,
  };
})();

</script>
<script>
/* ===== app ===== */
const allTrees=()=>[...TREES,...S.customTrees];
function rate7(){let d=0,t=0;for(let i=0;i<7;i++){const x=new Date(today);x.setDate(x.getDate()-i);const h=i?S.hist[kd(x)]:{d:S.R.filter(r=>r.done).length,t:S.R.length};if(h){d+=h.d;t+=h.t}}return t?Math.round(d/t*100):0}
function donut(parts,sz,ctr,col){const r=sz/2-14,c=2*Math.PI*r;let o=0,tot=parts.reduce((a,b)=>a+b[0],0)||1;
return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="16"/>`+parts.map(p=>{const l=p[0]/tot*c;const s=`<circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${p[1]}" stroke-width="16" stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-o}" transform="rotate(-90 ${sz/2} ${sz/2})"/>`;o+=l;return s}).join('')+`<text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${sz/4.5}" font-weight="700" fill="${col||'currentColor'}">${ctr}</text></svg>`}
const top3=()=>[...S.R].sort((a,b)=>b.st-a.st).slice(0,3).map(r=>r.id);
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stage(){if(!TM)return 0;const p=TM.kind=='sw'?Math.min(TM.t/1800,1):1-TM.t/TM.tot;return Math.min(4,Math.floor(p*5))}
const treeEm=i=>STG[i]||S.sel;

function render(){
 $('#nv').innerHTML=[['home','🏠','ホーム'],['team','👥','チーム'],['my','👤','マイページ'],['grow','🌳','育成・森']].map(a=>`<button class="${!VIEW&&S.tab==a[0]?'on':''}" onclick="S.tab='${a[0]}';VIEW=null;render();save()"><span>${a[1]}</span>${a[2]}</button>`).join('');
 const m=$('#m'),sc=m.scrollTop;m.innerHTML='';
 if(VIEW){const f=Router.screens[VIEW.name];
  const back=VIEW.name=='journal'?['← ホームへ',()=>{VIEW=null;S.tab='home';render()}]:['← 霧晴れの開拓日誌',()=>Router.navigate('journal')];
  m.appendChild(Utils.el('button',{class:'btn g',style:'margin-bottom:8px',onclick:back[1]},back[0]));
  const root=Utils.el('div',{});m.appendChild(root);try{f(root,VIEW.params)}catch(e){console.error(e);root.textContent='画面の表示に失敗しました'}}
 else{m.innerHTML=({home,team,my,grow}[S.tab])();bindLP();bindOpen();m.scrollTop=sc}
 $('#ov').innerHTML=MODAL;refreshBar();renderLock()}
function bindOpen(){document.querySelectorAll('details[data-k]').forEach(d=>d.addEventListener('toggle',()=>{OPEN[d.dataset.k]=d.open}))}
function refreshBar(){$('#mb').innerHTML=TM?`<div class="bar"><span style="font-size:24px">${treeEm(stage())}</span><div class="sp"><b>${esc(TM.name)}</b><div id="tt" style="font-size:20px">${fmt(TM.t)}</div></div><button class="btn g" onclick="pause()">${TM.pa?'▶ 再開':'⏸ 一時停止'}</button><button class="btn" onclick="stopT()">■ 停止</button><button class="btn g" onclick="openLock()">🔒</button></div>`:''}

/* ---------- ホーム ---------- */
function home(){const r=rate7(),c=r<=20?'#EF4444':r<60?'#F59E0B':'#3B82F6';
let h=`<button class="card btn-card" onclick="Router.navigate('journal')">🌫 <b>霧晴れの開拓日誌</b><span class="sm"> 日記・読書記録・音読ディクテーション</span></button>
<div class="card" style="text-align:center"><div class="sm">直近7日間の達成率</div>${donut([[r,c],[100-r,'#e5e7eb']],170,r+'%',c)}</div>
<div class="tabs"><button class="${S.mode=='rt'?'on':''}" onclick="S.mode='rt';render()">ルーティーン</button><button class="${S.mode=='td'?'on':''}" onclick="S.mode='td';render()">ToDo</button></div>`;
const k=S.mode;
const editRow=`<div class="row" style="margin:4px 0"><span class="sm sp">${EDIT[k]?'編集モード：✏️で編集、🗑️で削除':'項目を長押しで編集モード'}</span><button class="btn g" onclick="setEdit('${k}',${!EDIT[k]})">${EDIT[k]?'✓ 編集を終了':'✏️ 編集'}</button></div>`;
if(k=='rt'){const tags=['すべて',...new Set(S.R.map(r=>r.tag))],t3=top3();
if(S.tag!='すべて'&&!tags.includes(S.tag))S.tag='すべて';
h+=`<div class="row"><select class="s" onchange="S.per=this.value;render()">${['1日','1週間','1ヶ月','1年'].map(p=>`<option ${p==S.per?'selected':''}>${p}</option>`).join('')}</select><div class="chips">${tags.map(t=>`<button class="chip ${S.tag==t?'on':''}" data-tag="${esc(t)}" onclick="S.tag=this.dataset.tag;render()">${esc(t)}</button>`).join('')}</div></div>`+editRow;
S.R.filter(r=>S.tag=='すべて'||r.tag==S.tag).forEach(r=>{const cnt={'1日':'','1週間':`今週 ${Math.min(7,r.st)}/7`,'1ヶ月':`今月 ${Math.min(30,r.st)}/30`,'1年':`今年 ${r.st*3}日`}[S.per];
const acts=EDIT.rt?`<button class="btn g" onclick="event.stopPropagation();rModal(${r.id})">✏️</button><button class="btn del" onclick="event.stopPropagation();delR(${r.id})">🗑️</button>`
:`${r.alt?`<button class="btn g" onclick="event.stopPropagation();r_alt(${r.id})">${r.useAlt?'通常に':'ミニ'}</button>`:''}${r.m!='check'&&!r.done?`<button class="btn" onclick="event.stopPropagation();startT(${r.id})">▶ ${r.m=='sw'?'計測':(r.pomo?'25:5':r.min+'分')}</button>`:''}`;
h+=`<div class="card rt lp ${r.done?'done':''} ${EDIT.rt?'editing':''}" data-lp="rt" onclick="cardClick('rt',${r.id})"><div class="chk">${r.done?'✓':''}</div><div class="sp"><div class="sm">${esc(r.w)} ・ #${esc(r.tag)}</div><b>${esc(r.alt&&r.useAlt?r.alt+'（ミニ）':r.n)}</b><div class="sm">${r.st}日連続${t3.includes(r.id)?' 🔥':''} ${cnt}</div></div>${acts}</div>`});
if(!S.R.length)h+='<p class="sm">ルーティーンがありません。＋で追加できます。</p>';
if(!EDIT.rt)h+=`<button class="fab" onclick="rModal(null)">＋</button>`}
else{h+=editRow+`<div class="grid">`+S.T.map(t=>`<div class="tile lp ${t.done?'ok':''} ${t.st>=10?'top':''}" data-lp="td" onclick="cardClick('td',${t.id})">${EDIT.td?`<div class="tact"><button onclick="event.stopPropagation();tModal(${t.id})">✏️</button><button onclick="event.stopPropagation();delT(${t.id})">🗑️</button></div>`:''}<div class="ic" style="color:${t.st>=10?'#333':'#fff'}">${t.done&&t.st<10?'✔':esc(t.ic)}</div>${esc(t.n)}${t.st>=10?`<div style="font-size:12px">${t.st} ★</div>`:''}</div>`).join('')+`<div class="tile" style="background:#999" onclick="tModal(null)"><div class="ic">＋</div>タスクを追加</div></div>`}
return h}

/* ---------- 長押し→編集モード（click競合は LPT で抑止） ---------- */
function bindLP(){document.querySelectorAll('[data-lp]').forEach(el=>{let t=null,x=0,y=0;
 el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;x=e.clientX;y=e.clientY;clearTimeout(t);t=setTimeout(()=>{LPT=Date.now();try{navigator.vibrate&&navigator.vibrate(20)}catch(_){}setEdit(el.dataset.lp,true)},500)});
 el.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-x,e.clientY-y)>10)clearTimeout(t)});
 ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>clearTimeout(t)));
 el.addEventListener('contextmenu',e=>e.preventDefault())})}
function setEdit(k,v){EDIT[k]=v;render()}
function cardClick(k,id){if(Date.now()-LPT<800||EDIT[k])return;k=='rt'?tog(id):togT(id)}
function tog(id){const r=S.R.find(x=>x.id==id);if(!r)return;r.done=!r.done;r.st+=r.done?1:-1;if(r.done)S.coins+=5;save();render()}
function togT(id){const t=S.T.find(x=>x.id==id);if(!t)return;t.done=!t.done;t.st+=t.done?1:-1;save();render()}
function r_alt(id){const r=S.R.find(x=>x.id==id);r.useAlt=!r.useAlt;render()}
function delR(id){const r=S.R.find(x=>x.id==id);if(!r)return;if(TM&&TM.id==id)return Utils.showToast('計測中のため削除できません','error');
 if(!confirm(`「${r.n}」を削除しますか？`))return;S.R=S.R.filter(x=>x.id!=id);delete S.rem[id];save();render()}
function delT(id){const t=S.T.find(x=>x.id==id);if(!t)return;if(!confirm(`「${t.n}」を削除しますか？`))return;S.T=S.T.filter(x=>x.id!=id);save();render()}
function closeModal(){MODAL='';render()}
function rModal(id){const r=id?S.R.find(x=>x.id==id):null,tags=[...new Set(S.R.map(x=>x.tag))],kind=r?(r.pomo?'pomo':r.m):'check';
 MODAL=`<div class="modal"><div><h3>${r?'ルーティーン編集':'ルーティーン追加'}</h3><label>名前</label><input id="a1" value="${esc(r?r.n:'')}"><label>タイミング（きっかけ）</label><input id="a2" value="${esc(r&&r.w!='いつでも'?r.w:'')}" placeholder="朝起きたら"><label>代替行動（ミニ目標）</label><input id="a3" value="${esc(r?r.alt:'')}" placeholder="5分散歩"><label>タグ（既存を選ぶか新規入力）</label><select id="a4" onchange="$('#a5').value=this.value">${tags.map(t=>`<option ${r&&r.tag==t?'selected':''}>${esc(t)}</option>`).join('')}</select><input id="a5" value="${esc(r?r.tag:'')}" placeholder="新規タグ"><label>計測</label><select id="a6">${[['check','なし（チェック式）'],['timer','タイマー（カウントダウン）'],['pomo','タイマー（ポモドーロ）'],['sw','ストップウォッチ']].map(o=>`<option value="${o[0]}" ${o[0]==kind?'selected':''}>${o[1]}</option>`).join('')}</select><label>時間（分）</label><input id="a7" type="number" value="${r&&r.min?r.min:10}"><div class="row" style="margin-top:12px"><button class="btn g sp" onclick="closeModal()">キャンセル</button><button class="btn sp" onclick="saveR(${id||'null'})">${r?'保存':'追加'}</button></div></div></div>`;render()}
function saveR(id){const n=$('#a1').value.trim();if(!n)return Utils.showToast('名前を入力してください','error');const k=$('#a6').value;
 const v={n,w:$('#a2').value||'いつでも',alt:$('#a3').value,tag:$('#a5').value.trim()||$('#a4').value||'その他',m:k=='pomo'?'timer':k,pomo:k=='pomo'?1:0,min:+$('#a7').value||10};
 if(id){const r=S.R.find(x=>x.id==id);if(r)Object.assign(r,v)}else S.R.push({id:Date.now(),st:0,done:0,...v});
 MODAL='';save();render()}
function tModal(id){const t=id?S.T.find(x=>x.id==id):null;
 MODAL=`<div class="modal"><div><h3>${t?'タスク編集':'タスク追加'}</h3><label>名前</label><input id="t1" value="${esc(t?t.n:'')}"><label>アイコン（絵文字）</label><input id="t2" value="${esc(t?t.ic:'⭐')}"><div class="row" style="margin-top:12px"><button class="btn g sp" onclick="closeModal()">キャンセル</button><button class="btn sp" onclick="saveT(${id||'null'})">${t?'保存':'追加'}</button></div></div></div>`;render()}
function saveT(id){const n=$('#t1').value.trim();if(!n)return Utils.showToast('名前を入力してください','error');const ic=$('#t2').value.trim()||'⭐';
 if(id){const t=S.T.find(x=>x.id==id);if(t){t.n=n;t.ic=ic}}else S.T.push({id:Date.now(),n,ic,st:0,done:0});MODAL='';save();render()}

/* ---------- タイマー／ストップウォッチ（時刻差分で計測。バックグラウンドでもずれにくい） ---------- */
function startT(id){if(TM)return Utils.showToast('計測中のタスクがあります','error');const r=S.R.find(x=>x.id==id);if(!r)return;
 const mins=r.useAlt?2:(r.pomo?25:r.min);
 TM={id,name:r.n,kind:r.m=='sw'?'sw':'cd',t:r.m=='sw'?0:mins*60,tot:mins*60,pa:0,ph:'work',pomo:r.pomo,acc:0,last:Date.now(),ls:0};
 TM.iv=setInterval(tick,1000);
 audioPlay(r.pomo?'ポモドーロ.m4a':'作業用.m4a');mediaInit(r);render()}
function tick(){if(!TM)return;const n=Date.now();if(!TM.pa)TM.acc+=n-TM.last;TM.last=n;const s=Math.floor(TM.acc/1000);
 TM.t=TM.kind=='sw'?s:Math.max(0,TM.tot-s);if(TM.kind=='cd'&&TM.t<=0)return fin();
 const e=$('#tt');if(e)e.textContent=fmt(TM.t);const l=$('#lt');if(l)l.textContent=fmt(TM.t);
 const sg=stage();if(sg!==TM.ls){TM.ls=sg;if(!MODAL)render()}}
function pause(){if(!TM)return;tick();TM.pa=!TM.pa;TM.last=Date.now();
 const a=$('#bgm');try{if(TM.pa)a.pause();else{const p=a.play();p&&p.catch&&p.catch(()=>{})}}catch(e){}
 try{navigator.mediaSession.playbackState=TM.pa?'paused':'playing'}catch(e){}render()}
function fin(){const r=S.R.find(x=>x.id==TM.id);try{navigator.vibrate([500,200,500])}catch(e){}
 if(r&&r.pomo&&TM.ph=='work'){TM.ph='rest';TM.acc=0;TM.last=Date.now();TM.t=300;TM.tot=300;TM.name=r.n+'（休憩5分）';Utils.showToast('休憩の時間です（5分）','success');render();return}
 finishTimer(true)}
function stopT(){if(!TM)return;tick();
 MODAL=`<div class="modal"><div><h3>計測を停止</h3><p class="sm">${esc(TM.name)}　${fmt(TM.t)}</p><div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><button class="btn" onclick="MODAL='';finishTimer(true)">✅ 完了として記録する</button><button class="btn g" onclick="MODAL='';finishTimer(false)">⛔ 中断する（木が枯れます）</button><button class="btn g" onclick="closeModal()">続ける</button></div></div></div>`;render()}
function finishTimer(ok){if(!TM)return;const t=TM;clearInterval(t.iv);const r=S.R.find(x=>x.id==t.id);const el=Math.floor(t.acc/1000);TM=null;
 audioStop();let msg='';
 if(ok){if(r&&!r.done){r.done=1;r.st++}S.coins+=15;S.forest.push(S.sel);
  const k=kd(today),h=S.hist[k]||{m:0};S.hist[k]={d:S.R.filter(x=>x.done).length,t:S.R.length,m:(h.m||0)+Math.max(1,Math.round(el/60))};
  msg=`🌳 記録しました（${fmt(el)}）。森に木を植えました (+15コイン)`}
 else{S.forest.push('🪵');msg='途中で中断したため、枯れ木になりました'}
 save();render();Utils.showToast(msg,ok?'success':'info')}

/* ---------- 音声（<audio>＋Media Session）。失敗してもタイマーは止めない ---------- */
function audioPlay(src){try{const a=$('#bgm');if(a.dataset.f!==src){a.dataset.f=src;a.src=src}a.loop=true;const p=a.play();
 if(p&&p.catch)p.catch(e=>console.warn('[音声] 再生できません（ファイル未配置/自動再生制限）',e));
 try{navigator.mediaSession.playbackState='playing'}catch(e){}}catch(e){console.warn('[音声]',e)}}
function audioStop(){try{const a=$('#bgm');a.pause();try{a.currentTime=0}catch(e){}}catch(e){}
 try{navigator.mediaSession.playbackState='none';navigator.mediaSession.metadata=null}catch(e){}}
function mediaInit(r){if(!('mediaSession' in navigator))return;try{
 navigator.mediaSession.metadata=new MediaMetadata({title:r.n,artist:'習慣の森',album:r.pomo?'ポモドーロ':'作業用'});
 const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
 h('play',()=>{if(TM&&TM.pa)pause()});h('pause',()=>{if(TM&&!TM.pa)pause()});
 h('stop',()=>{if(TM)finishTimer(true)})}catch(e){console.warn(e)}}
document.addEventListener('DOMContentLoaded',()=>{const a=$('#bgm');if(a)a.addEventListener('error',()=>console.warn('[音声] 読み込みエラー：ポモドーロ.m4a / 作業用.m4a をHTMLと同じ場所に置いてください'))});

 el.innerHTML=`<div class="lock"><div style="font-size:56px">${new Date().toTimeString().slice(0,5)}</div>

`<div class="card"><input id="pt" placeholder="達成報告を書く…"><div class="row" style="margin-top:6px"><input id="pi" type="file" accept="image/*" style="font-size:12px"><button class="btn" onclick="post()">投稿</button></div></div>`}

<div class="card"><b>タグ別割合</b><div class="row">${donut(tp,150,'タグ')}<div class="sm">${tp.map(p=>`<div><span style="color:${p[1]}">●</span> ${esc(p[2])}</div>`).join('')}</div></div></div>
<div class="card"><b>⚙ 設定・連携</b>${det('s1','🔔 通知設定',s1)}${det('s2','🔗 連携（Google・GitHub）',s2)}${det('s3','💾 バックアップの入力と出力（JSON・ZIP）',s3)}${det('s4','🌱 樹種の絵文字追加',s4)}</div>`}
function askNotif(){try{Notification.requestPermission().then(p=>Utils.showToast('通知: '+p,'info'))}catch(e){Utils.showToast('このブラウザは通知に対応していません','error')}}
function ghSave(){AssetManager.setGithubConfig({owner:$('#gh1').value,repo:$('#gh2').value,branch:$('#gh3').value,token:$('#gh4').value});Utils.showToast('GitHub設定を保存しました','success')}
function addTree(){const e=$('#tr1').value.trim(),n=$('#tr2').value.trim(),c=Math.max(0,parseInt($('#tr3').value)||0);
 if(!e||!n)return Utils.showToast('絵文字と樹種名を入力してください','error');if(allTrees().some(t=>t[0]==e))return Utils.showToast('その絵文字は既にあります','error');
 S.customTrees.push([e,n,c]);save();OPEN.s4=true;render();Utils.showToast('樹種を追加しました（育成・森の図鑑に表示）','success')}
function dl(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function icsDl(){const t=new Date(),p=n=>String(n).padStart(2,'0');const txt='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//shukan-no-mori//JA\r\n'+S.R.map(r=>`BEGIN:VEVENT\r\nUID:${r.id}@shukan\r\nSUMMARY:${String(r.n).replace(/[\r\n,;]/g,' ')}\r\nDTSTART:${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}T070000\r\nRRULE:FREQ=DAILY\r\nEND:VEVENT`).join('\r\n')+'\r\nEND:VCALENDAR';
 dl('shukan_no_mori.ics',new Blob([txt],{type:'text/calendar'}))}

/* ---------- バックアップ ---------- */
function exportJson(){const o=JSON.parse(JSON.stringify(S));if(o.user&&o.user.settings&&o.user.settings.github)o.user.settings.github.token='';return JSON.stringify(o)}
function jsonOut(){$('#js').value=exportJson()}
function jsonFile(){dl('shukan_no_mori_backup_'+Utils.todayStr()+'.json',new Blob([exportJson()],{type:'application/json'}))}
async function zipOut(){try{await persist();dl('shukan_no_mori_backup_'+Utils.todayStr()+'.zip',ZipUtil.create([{name:'backup.json',data:exportJson()}]));Utils.showToast('ZIPを書き出しました','success')}catch(e){Utils.showToast('ZIPの書き出しに失敗: '+e.message,'error')}}
function applyBackup(o){if(!o||typeof o!=='object'||Array.isArray(o)||!Array.isArray(o.R))throw new Error('このアプリのバックアップではありません');
 if(!confirm('現在のデータをバックアップの内容で上書きします。よろしいですか？'))return false;
 const tk=AssetManager.getGithubConfig().token;Object.keys(o).forEach(k=>{S[k]=o[k]});fixDefaults();
 const g=S.user.settings.github;if(!g.token)g.token=tk;persist();render();Utils.showToast('復元しました','success');return true}
function jsonIn(){try{applyBackup(JSON.parse($('#js').value))}catch(e){Utils.showToast('復元できません: '+e.message,'error')}}
async function restoreFile(inp){const f=inp.files[0];if(!f)return;try{let txt;
 if(/\.zip$/i.test(f.name)){const m=await ZipUtil.read(await f.arrayBuffer());const b=m.get('backup.json');if(!b)throw new Error('ZIP内にbackup.jsonがありません');txt=ZipUtil.textOf(b)}else txt=await f.text();
 applyBackup(JSON.parse(txt))}catch(e){Utils.showToast('復元できません: '+e.message,'error')}inp.value=''}

/* ---------- 霧晴れの開拓日誌（日記・読書記録・音読ディクテーション） ---------- */
const jbtn=(label,fn)=>Utils.el('button',{class:'btn btn-primary btn-block',style:'margin:8px 0;padding:14px',onclick:fn},label);
Router.registerScreen('journal',root=>root.appendChild(Utils.el('div',{class:'screen-inner'},[Utils.el('h2',{},'🌫 霧晴れの開拓日誌'),
 jbtn('📝 日記を書く',()=>Router.navigate('diaryWrite')),jbtn('📖 これまでの日記を見る',()=>Router.navigate('diaryList')),
 jbtn('📚 読書記録をつける',()=>Router.navigate('books')),jbtn('🎧 音読ディクテーション',()=>Router.navigate('dictationList'))])));
Router.registerScreen('diaryWrite',root=>{const d=Utils.todayStr(),cur=S.diary.find(x=>x.date==d);
 const ta=Utils.el('textarea',{class:'review-textarea',rows:'8',placeholder:'今日あったこと、考えたこと…'});ta.value=cur?cur.text:'';
 root.appendChild(Utils.el('div',{class:'screen-inner'},[Utils.el('h2',{},'日記を書く（'+d+'）'),ta,
  Utils.el('button',{class:'btn btn-primary btn-block',style:'margin-top:10px',onclick:()=>{const t=ta.value.trim();if(!t)return Utils.showToast('日記が空です','error');
   const e=S.diary.find(x=>x.date==d);if(e)e.text=t;else S.diary.push({id:Utils.generateId('diary'),date:d,text:t});
   const r=S.R.find(x=>x.n=='一言日記');if(r&&!r.done){r.done=1;r.st++;S.coins+=5}
   save();Utils.showToast('日記を保存しました','success');Router.navigate('journal')}},'保存する')]))});
Router.registerScreen('diaryList',root=>{const w=Utils.el('div',{class:'screen-inner'},[Utils.el('h2',{},'これまでの日記')]);
 [...S.diary].sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>w.appendChild(Utils.el('div',{class:'card'},[Utils.el('b',{},e.date),Utils.el('div',{style:'white-space:pre-wrap;margin:6px 0'},e.text),
  Utils.el('button',{class:'btn g',onclick:()=>{if(confirm(e.date+'の日記を削除しますか？')){S.diary=S.diary.filter(x=>x.id!=e.id);save();Router.navigate('diaryList')}}},'削除')])));
 if(!S.diary.length)w.appendChild(Utils.el('p',{class:'sm'},'まだ日記がありません。'));root.appendChild(w)});

/* ---------- 起動 ---------- */
function fixDefaults(){['diary','books','bookFolders','dictationSets','dictationFolders','customTrees','own','forest','R','T','P'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
 ['rem','hist','dictationRewards'].forEach(k=>{if(!S[k]||typeof S[k]!=='object')S[k]={}});
 if(!S.user)S.user={};if(!S.user.settings)S.user.settings={};if(!S.user.settings.github)S.user.settings.github={owner:'',repo:'',branch:'main',token:''};
 S.compass=S.compass||0;delete S.modal}
(async()=>{let loaded=null;try{loaded=await idbGet('state')}catch(e){console.warn('IndexedDB不可: localStorageを使用',e)}
 if(!loaded){try{const x=localStorage.getItem('hb');if(x)loaded=JSON.parse(x)}catch(e){}}
 if(loaded&&typeof loaded==='object')Object.assign(S,loaded);fixDefaults();render()})();

</script></body></html>
